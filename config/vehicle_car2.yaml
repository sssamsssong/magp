# ═══════════════════════════════════════════════════════════════════
#  2호차
#
#  ★ "미측정" 이라고 적힌 값은 **1호차에서 빌려온 출발점**이다.
#    재고 나면 값을 고치고 그 표시를 지울 것. 기동할 때 몇 개 남았는지 센다.
#
#  측정 순서 (뒤 단계가 앞 단계에 의존한다):
#    ① 모터 방향        ✅ 완료 — 아래 부호
#    ② 오도메트리 스케일  ros2 run race_stack odom_scale   (줄자, 6회)
#    ③ 조향 중립·게인    ./race.sh steertrim
#    ④ 기구 스토퍼       vesc_steer_test.yaml + steer_limit_check
#    ⑤ 무게·하중분포     저울
#  ②가 틀리면 그 위의 전부가 틀린다 — 속도 프로파일·μ 추정이 v² 에 비례한다.
# ═══════════════════════════════════════════════════════════════════

vesc:
  # ★ 부호: 이 차는 모터 결선이 1호차와 반대다 (2026-08-09 실측).
  #   양수 speed 지령이 후진이었고, vesc_to_odom 도 같은 게인을 쓰므로
  #   물리적 전진을 "후진" 으로 보고해 SLAM 맵이 방사형으로 깨졌다.
  #   조이스틱만 speed_invert:true 로 덮여 있어 수동 주행은 정상처럼 보였다 —
  #   증상을 덮으면 원인이 숨는다는 사례다.
  # ✅ 2026-08-16 크기 실측 — odom_scale (줄자, 여러 회). 4203 → 4403 (+4.76%).
  #   4203 은 1호차 값이었다. 그동안 차는 **지령보다 4.5% 느리게** 달렸고
  #   odom 은 거리를 **4.8% 과대보고** 하고 있었다:
  #       지령 3.0㎧ → erpm 4203×3.0 = 12609 → 실제 12609/4403 = 2.864㎧
  #                                          → odom 은 12609/4203 = 3.000 이라 보고
  #
  #   ★ 독립 검증이 있다. 08-13 주행 로그(20260813_222327)에서
  #     map 프레임 실이동 99.72m 대 odom 속도 적분 104.48m = **비 1.048** 이었다.
  #     4203 × 1.048 = 4405 — 줄자 실측 4403 과 사실상 일치한다.
  #     전혀 다른 두 방법(줄자 / AMCL 맵 프레임)이 같은 곳을 가리킨다.
  #
  #   ⚠ 같은 설정에서 차가 실제로 4.8% 빨라진다. a_lat = κv² 라 횡가속 요구는
  #     9.7% 늘어난다. 보정 직후 첫 주행은 grip_util 을 낮춰서 볼 것.
  #   ⚠ odom 속도를 쓴 옛 측정은 다시 봐야 한다 — speed_lag, slip_gain.
  #     (조향 게인은 영향 없다: κ 를 map 프레임 x,y 로만 재서 odom 속도를 안 썼다)
  speed_to_erpm_gain: -4403.0

  # ✅ 2026-08-13 (2차) — **주행 로그**로 보정. -1.0827 → -0.89 (22% 축소)
  #
  #   1차로 손으로 밀어 그린 원에서 -1.0827 을 얻었는데, 그 값이 맞다면 차는
  #   지령대로 꺾여야 한다. logs/20260813_* 4개 주행에서 확인하니 **항상 더
  #   꺾이고 있었다.** 세 가지 독립 계산이 같은 배율로 모인다:
  #       비포화 코너 κ_기하/κ_지령        1.23   (yaw+경로)
  #       좌회전만 (n=157)                 1.26   (yaw+경로)
  #       4개 주행 κ p95 ↔ 조향한계 대조   1.24   (★ 경로 좌표만)
  #     마지막이 특히 강하다. yaw·속도·조향을 **전혀 안 쓰고** x,y 로만 잰 곡률
  #     p95 가 0.984/1.005/1.039/1.049 로 뭉치는데, 22% 보정 시 이론 한계가
  #     0.995 다. 회귀 절편 0.61° = 편향이 아니라 순수 배율이라는 뜻.
  #
  #   ★ 왜 1차가 틀렸나 — 손으로 밀면 앞타이어가 끌려(scrub) 원이 실제보다
  #     커진다. 그럼 δ 를 작게 보고 |gain| 을 크게 잡는다. steer_gain_check.py
  #     문서에 적어둔 "빨리 밀면 원이 커진다" 그 함정에 정확히 그 방향으로 걸렸다.
  #     다시 잰다면 **손으로 밀지 말고 저속으로 주행해서** 원을 그릴 것.
  #
  #   ★ 물리적 조향 범위는 하나도 안 변한다. servo_min 0.15 가 그대로라 차가
  #     실제로 꺾이는 각도는 전과 동일하다 — 이미 R 1.0m 를 돌고 있었다.
  #     바뀌는 건 컨트롤러의 **믿음**뿐이다. 그래서 a053912(1호차가 max_steer 를
  #     넓혔다가 직선에서 발산)와 상황이 다르다: 지금은 유효 루프 게인이 1.22배
  #     과하게 걸려 있었고, 보정하면 **줄어든다**. 코너 안쪽으로 파고들던 것도
  #     (로그 4개 전부 73~84% 안쪽) 이 과게인으로 설명된다.
  #
  #   ⚠ 검증된 건 **좌측뿐**이다. map_0813 이 좌회전 일색이라 코너 샘플이
  #     좌 157 : 우 5 였다. max_steer 를 정하는 게 좌측이라 필요한 쪽은 맞지만,
  #     우회전 트랙을 쓰게 되면 다시 볼 것.
  #
  #   경과:  -0.761(1호차) → -1.0827(원 실측) → -0.89(주행 로그)
  #       max_steer  0.3711(21.26°) → 0.2608(14.94°) → 0.3173(18.18°)
  #       R_min      0.848m         → 1.236m         → 1.005m
  #
  #   ※ offset 은 그대로 0.4324 를 쓴다. 원 측정의 0.4656 은 양 끝을 직선으로
  #     이어 중앙을 **외삽**한 값이고, steer_trim 은 직진 주행으로 **직접** 쟀다.
  #     주행 로그 회귀의 절편도 0.61° 라 중립은 잘 맞아 있다.
  #   ※ 스토퍼(servo 0.0224/0.9124) 각도를 이 게인으로 계산하면 26.4°/30.9° 다.
  #     steer_limit_check 이 찍었던 30.87°/36.14° 는 1호차 게인 환산이라 무효 —
  #     실측된 건 서보값뿐이다.
  steering_angle_to_servo_gain:   -0.89

  # ✅ 2026-08-10 steer_trim.py 실측 (2회). 0.3954(1호차) → 이 값.
  #     1차  0.3954 → 0.4332  (trim=-0.0496rad, iter=3)
  #     2차  0.4332 → 0.4324  (trim=+0.0011rad, iter=1)  ← 재확인, 0.06° 만 이동
  #   1호차 대비 서보 +0.0370 = 조향각 약 -2.8°. 2호차가 그만큼 좌로 틀어져 있었다.
  #   ※ 기계 중립은 ≈0.53 이다(docs/steering_calibration.md). 아직 6° 가량 멀다
  #     = 타이로드가 어긋나 있다는 뜻. 대회 전 기계 정렬 후 재측정 권장.
  steering_angle_to_servo_offset:  0.4324

  # ★ 이 두 값이 max_steer 를 정한다 — (servo−offset)/(−gain) 중 작은 쪽.
  #   그래서 "기구 스토퍼"가 아니라 "쓰기로 한 한계"를 적어야 한다.
  #
  #   2026-08-10 steer_limit_check.py 실측 기구 스토퍼 — **서보값만 실측**이다:
  #       좌 servo 0.0224     우 servo 0.9124
  #     (1호차는 0.100/0.860 — 2호차 서보 가동폭이 17% 넓다)
  #     ⚠ 그 도구가 함께 찍은 각도 30.87°/36.14° 는 **무효**다. 1호차 게인으로
  #       환산한 값이었다. 보정 게인(-0.89)으로 다시 계산하면 26.4°/30.9°.
  #
  #   ✅ 스토퍼까지 열지 않고 0.15/0.85 를 쓴다:
  #     · 지금 값 → max_steer 0.3173rad(18.18°), R_min 1.005m
  #     · 스토퍼까지 열면 26.4° 인데, 1호차가 max_steer 를 11% 넓힌 것만으로도
  #       직선에서 조향이 발산했다 (a053912). max_steer 포화가 유일한 감쇠원이라
  #       넓히려면 컨트롤러 게인 안정화(gain·steer_lpf)가 선행돼야 한다
  #     · 스토퍼로부터 좌 0.128 / 우 0.062 떨어져 있어 서보 발열도 막는다
  #
  #   ★ 2026-08-13 게인 보정으로 18.18° 가 되어 1호차 검증값(20.73°)에 근접했다.
  #     ⚠ 이건 **더 열어서** 얻은 게 아니다 — servo_min 은 0.15 그대로다.
  #       차가 원래부터 그만큼 꺾이고 있었고, 숫자가 현실을 따라온 것뿐이다.
  #     더 열고 싶으면 0.15 → 0.12 → 0.10 으로 단계적으로
  #     (0.10 이면 21.9°, R_min 0.821m, 스토퍼 여유 0.078 유지).
  servo_min: 0.15
  servo_max: 0.85

geometry:
  # ✅ 2026-08-16 줄자 실측 — 앞바퀴 축 중심 ↔ 뒷바퀴 축 중심, 0.33 → 0.32.
  #   0.33 은 1호차에서 빌려온 값이었는데, 사실 1호차도 이미 0.32 로 재놓고
  #   설정만 안 고친 상태였다 (docs/hypermap_voser_next.md, map_controller.py:112
  #   의 "실측 2026-08-09: L=0.32m"). 두 차 다 3% 틀린 값으로 돌고 있었다.
  #
  #   ★ max_steer 는 안 변한다 — (servo_min−offset)/(−gain) 이라 wheelbase 가
  #     안 들어간다. 대신 그 조향각이 만드는 **반경**이 바뀐다:
  #       R_min = L/tan(max_steer)   1.005m → 0.974m   (κ_한계 0.995 → 1.026)
  #     차가 믿었던 것보다 3% 더 조여 돈다.
  #
  #   ⚠ 조향 게인(-0.89)은 이 값에 **간접적으로** 걸려 있다. 08-13 로그 분석에서
  #     κ_지령 = tan(δ)/L 을 L=0.33 으로 계산했으므로, L=0.32 면 κ_지령이 3% 커지고
  #     실제/지령 비율이 그만큼 내려간다 (1.227 → 1.189). 역산하면 게인이
  #     -0.89 가 아니라 -0.91 쯤이어야 한다. 다만 주행별 산포(0.91~0.97)가 이보다
  #     커서 지금 바꾸지 않는다 — **다음 주행 로그로 다시 확인할 것.**
  wheelbase: 0.32
  # ✅ 2026-08-16 저울 실측 (주행 상태 그대로 — 배터리·LiDAR·젯슨 다 얹고).
  #     앞축 1611g   뒤축 1944g   전체 3487g
  #
  #   ★ 앞+뒤 = 3555g 로 전체보다 68g(2.0%) 크다. 저울 면과 반대쪽 받침 높이가
  #     완전히 안 맞아 하중이 조금 이중으로 잡힌 것이다. 그래서 **전체를 따로
  #     쟀고, mass 는 그 값을 쓴다** — 한 번에 올려 재므로 수평 오차를 안 탄다.
  #     lf/lr 은 앞뒤 **비율**만 쓰므로 이 불일치의 영향을 받지 않는다
  #     (Wr/(Wf+Wr) 에서 약분된다).
  #
  #   하중 분포  앞 45.3% / 뒤 54.7%   (1호차는 45.1/54.9 — 거의 같다)
  #   lf = L×(뒤/합) = 0.32×0.54684 = 0.1750     lf = CG↔앞축
  #   lr = L×(앞/합) = 0.32×0.45316 = 0.1450     lr = CG↔뒷축   (lf+lr = L ✓)
  #
  #   ※ 조향에는 영향이 없다 (Pacejka 식에서 약분). 실제로 쓰이는 곳은
  #     **종방향 가속 상한**이다 — 후륜구동이라 후축 하중분율이 한계:
  #       a_acc = μ_eff·g·lf/L = 0.4×9.81×0.5468 = 2.146 ㎧²
  #     1호차 2.155 와 거의 같아 주행 거동이 크게 바뀌지는 않는다.
  mass:      3.487
  lf:        0.1750
  lr:        0.1450

tire:
  mu: 0.348            # 미측정 — η 스윕으로 확인 (그게 곧 μ 측정이다)
  pac_b:  3.8
  pac_c:  1.3
  pac_d:  1.15
  pac_e: -0.5

# ── 튜닝값 — 1호차 검증값에서 출발 ─────────────────────────────────
#   실차 로그로 확인된 값이라 출발점으로 안전하다. 2호차 로그가 쌓이면
#   같은 방법으로 다시 잡을 것:
#     speed_lag  = speed ↔ cmd_v 상호상관 최대 지점
#     slip_gain  = 주행 궤적 곡률 ÷ 기준 곡률 (1.0 이 목표)
#     steer_alpha/l1_k = 직선 구간 δ·헤딩·CTE 주파수 분해
tuning:
  # ★ L1 = **max(l1_min, l1_k·v)** 다 — 덧셈이 아니다 (map_controller.py:500).
  #   그래서 l1_min 은 v < l1_min/l1_k = 1.6 m/s 에서만 작동하는 **바닥값**이고,
  #   그 위에서는 l1_k·v 가 이긴다. 코너(v≈1.9)는 l1_k 영역, 저속 진입만 바닥값.
  #
  #   2026-08-13: 1.4983(1호차) → 1.20. 게인을 고친 뒤에도 코너 **진입에서만**
  #   안쪽으로 파고들었다 (logs/20260813_222327_q2_map):
  #       진입 +17.3㎝ 안쪽 80%  /  정점 +9.8㎝ 68%  /  탈출 −6.3㎝ 33%
  #   정점 편향은 게인 보정으로 이미 반이 됐는데(+18.7→+9.8) 진입만 남았다.
  #   ★ 결정적 증거: 같은 날 같은 라인에서 stanley(전방주시 없음)는 코너 편향이
  #     −6.0㎝ / 안쪽 51% 로 **사실상 0** 이었다. 전방주시를 쓰는 쪽에서만
  #     나타나면 원인은 L1 이다. 코너 R≈1m 인데 진입에서 L1 1.69m 를 봤다.
  #   ⚠ 줄이면 파고듦은 줄지만 직선에서 조향이 떨릴 수 있다. 한 단계씩:
  #       1.4983 → 1.20 → 1.00 (코드 기본값 0.90). 매번 직선 |CTE|(현재 10.0㎝)와
  #       조향 진동을 같이 볼 것.
  l1_min: 1.20
  # 직선 고속(3.6m/s)에서 L1 2.7m 는 적절하다 — 여기는 건드리지 않는다.
  l1_k:   0.75
  steer_alpha: 0.555     # ★ 50Hz 루프 기준 시정수 34ms. 주기가 다르면 환산할 것
  slip_gain:   0.5
  speed_lag:   0.40
  a_lon_acc:   0.0
  a_lon_brk:   0.0

  # ★ 출발 직후만 가속을 더 조인다 [㎧²]. 0 = 끔.
  #   프로파일의 a_lon_acc 와 왜 따로 두나 — **출발이 특별하기 때문**이다.
  #   같은 가속도인데도 정지에서 뗀 5초 안쪽이 훨씬 더 미끄러진다
  #   (실측표와 논거는 speed_profile.LaunchLimiter). 정지마찰을 깨는 순간,
  #   구동계 백래시, 하중이 뒤로 쏠리며 앞이 뜨는 것이 겹친다.
  #   그 스핀이 odom 거리 과대보고 → 종방향 위치 오차 → 첫 코너 조기 진입.
  #   launch_time 에 걸쳐 a_lon_acc 로 선형 복귀한다. 감속에는 안 건다.
  #   미측정 — 1호차 값에서 출발. 2호차 bag 이 쌓이면 같은 방법으로 다시
  #   잡을 것 (odom 이동거리 ÷ AMCL 이동거리, 0.6초 창).
  launch_acc:  0.8
  launch_time: 3.0
  # ★ 첫 주행은 낮게. 캘리브레이션이 다 끝난 뒤 0.1 씩 올리며 한계를 찾는다.
  #
  #   2026-08-17: 스칼라(0.2) → **모드별 딕셔너리**로 바꾼다. 값은 그대로다.
  #   이유는 SSH 에서 못 고쳤기 때문이다 — ./tune.sh q2=0.35 가
  #     "vehicle_car2.yaml 에 tuning.grip_util.q2 가 없다"
  #   로 거절했다. tune.py 는 limits.grip_util.* 를 차량 파일의 tuning.grip_util.*
  #   로 보내는데(VEHICLE_PREFIX), 스칼라에는 모드 키를 못 넣는다.
  #   딕셔너리로 두면 주행 중 SSH 한 줄로 바꿀 수 있다:
  #       ./tune.sh q2=0.35        ./tune.sh q1=0.5
  #
  #   ※ default 키는 두지 말 것 — 네 모드가 다 있으면 영원히 안 읽히는데 값만
  #     남아 손대게 된다 (docs/grip_util_shadowing.md).
  grip_util: {q1: 0.2, q2: 0.5, q3: 0.2, race: 0.2}

joystick:
  # ✅ 2026-08-10 실차 확인: false 가 맞다 (스틱 좌 = 앞바퀴 좌).
  #   08-09 에 true 로 잡았던 건 **속도 부호가 뒤집힌 상태에서 봤기 때문**이다.
  #   차가 후진 중에는 스틱을 좌로 밀어도 앞머리가 우로 도는 것처럼 보인다
  #   (후진 주차와 같은 감각). speed_to_erpm_gain 부호를 고치자 이중 반전이 되어
  #   좌우가 바뀌었고, false 로 되돌려 정상 확인했다.
  #   ※ 자율 경로의 조향 부호는 원래 맞았다 — steer_trim 이 수렴한 것이 그 증거다
  #     (부호가 반대면 trim -= damp·L·κ 보정이 반대로 밀려 발산한다).
  steer_invert:   false
  speed_invert:   false     # ★ 게인 부호로 고쳤으므로 여기서 또 뒤집지 말 것
  trigger_invert: true
  device:      /dev/input/js0
  axis_steer:  0
  axis_speed:  5
  btn_reverse: 5
  btn_toggle:  4
  debug:       true
  # ★ ./race.sh joy 수동 조종 상한 (m/s). race_script.yaml 은 7.0 인데 그건
  #   두 차 공용이라 여기서 2호차만 낮춘다 (1호차 값을 건드리지 않으려고).
  #   2026-08-10: 캘리브레이션 작업 중 조종이 너무 빨라 2.0 으로.
  #   odom_scale·조향 확인처럼 천천히 몰아야 하는 작업에는 이 정도가 적당하다.
  #   주행 감각을 확인할 땐 ./tune.sh 대신 이 줄을 고칠 것 (차량 파일이 이긴다).
  max_speed:   2.0

# ── 위치추정 ────────────────────────────────────────────────────────
localization:
  # /odom 병진 속도 부호. imu_odom 이 이 값으로 위치를 적분해
  # odom→base_link TF 를 낸다 = SLAM·AMCL 이 실제로 보는 것.
  #   +1.0  들어온 그대로 (기본)
  #   -1.0  뒤집는다
  # ★ 반드시 실측으로 정할 것 — 차를 손으로 앞으로 밀면서
  #     ros2 topic echo /odom_imu --field twist.twist.linear.x
  #   가 **양수**여야 한다. 음수면 -1.0 으로.
  #   틀리면 SLAM 이 전진을 후진으로 받아 맵이 통째로 깨진다.
  #
  # ✅ 2026-08-10 실측: 손으로 앞으로 밀면 **음수**, 뒤로 밀면 양수였다.
  #    → -1.0. 이유는 명령/오도메트리 경로의 부호 처리가 비대칭이라서다:
  #        ackermann_to_vesc :  erpm = gain × v          (음수 없음)
  #        vesc_to_odom      :  v    = (−erpm) / gain    (음수 있음)
  #      이 차는 모터 결선이 반대라 gain 이 음수인데, 그러면 지령은 맞고
  #      오도메트리만 한 번 더 뒤집힌다. 조이스틱 주행이 멀쩡해 보여서
  #      "주행은 되는데 맵만 안 나오는" 상태가 오래 갔다.
  speed_sign: -1.0

# ── 네트워크 ────────────────────────────────────────────────────────
#   CycloneDDS 가 유니캐스트로 인사할 고정 피어 목록. 상세는 vehicle_car1.yaml 참고.
network:
  # ★ ROS_DOMAIN_ID — 상세는 vehicle_car1.yaml 참고. 젯슨 IP 끝자리와 같게 둔다.
  #   노트북에서 붙을 때:  ./rviz.sh 77
  domain_id: 77
  peers:
    - 192.168.50.129         # 2호차 젯슨 (2026-08-09 확인)
