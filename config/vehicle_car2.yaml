# ═══════════════════════════════════════════════════════════════════
#  2호차
#
#  ★ "미측정" 이라고 적힌 값은 **1호차에서 빌려온 출발점**이다.
#    재고 나면 값을 고치고 그 표시를 지울 것. 기동할 때 몇 개 남았는지 센다.
#
#  측정 순서 (뒤 단계가 앞 단계에 의존한다):
#    ① 모터 방향        ✅ 완료 — 아래 부호
#    ② 오도메트리 스케일  ros2 run race_stack odom_scale   (줄자, 6회)
#    ③ 조향 중립·게인    ./race.sh steertrim
#    ④ 기구 스토퍼       vesc_steer_test.yaml + steer_limit_check
#    ⑤ 무게·하중분포     저울
#  ②가 틀리면 그 위의 전부가 틀린다 — 속도 프로파일·μ 추정이 v² 에 비례한다.
# ═══════════════════════════════════════════════════════════════════

vesc:
  # ★ 부호: 이 차는 모터 결선이 1호차와 반대다 (2026-08-09 실측).
  #   양수 speed 지령이 후진이었고, vesc_to_odom 도 같은 게인을 쓰므로
  #   물리적 전진을 "후진" 으로 보고해 SLAM 맵이 방사형으로 깨졌다.
  #   조이스틱만 speed_invert:true 로 덮여 있어 수동 주행은 정상처럼 보였다 —
  #   증상을 덮으면 원인이 숨는다는 사례다.
  #   ⚠ 크기 4203 은 1호차 값이다. 미측정 — odom_scale 로 재실측할 것.
  speed_to_erpm_gain: -4203.0

  steering_angle_to_servo_gain:   -0.761    # 미측정 (1호차 값)

  # ✅ 2026-08-10 steer_trim.py 실측 (2회). 0.3954(1호차) → 이 값.
  #     1차  0.3954 → 0.4332  (trim=-0.0496rad, iter=3)
  #     2차  0.4332 → 0.4324  (trim=+0.0011rad, iter=1)  ← 재확인, 0.06° 만 이동
  #   1호차 대비 서보 +0.0370 = 조향각 약 -2.8°. 2호차가 그만큼 좌로 틀어져 있었다.
  #   ※ 기계 중립은 ≈0.53 이다(docs/steering_calibration.md). 아직 6° 가량 멀다
  #     = 타이로드가 어긋나 있다는 뜻. 대회 전 기계 정렬 후 재측정 권장.
  steering_angle_to_servo_offset:  0.4324

  # ★ 이 두 값이 max_steer 를 정한다 — (servo−offset)/(−gain) 중 작은 쪽.
  #   그래서 "기구 스토퍼"가 아니라 "쓰기로 한 한계"를 적어야 한다.
  #
  #   2026-08-10 steer_limit_check.py 실측 기구 스토퍼:
  #       좌 servo 0.0224 (+30.87°)    우 servo 0.9124 (-36.14°)
  #     (1호차는 0.100/0.860 이었다 — 2호차 서보 가동폭이 17% 넓다)
  #
  #   ✅ 그런데 스토퍼까지 열지 않고 0.15/0.85 를 쓴다. 이유:
  #     · 지금 값 → max_steer 0.3711rad(21.26°). 1호차가 실차 검증한 0.36 과 거의 같다
  #     · 스토퍼까지 열면 30.87° 가 되는데, 1호차가 max_steer 0.36→0.40 (11% 확대)
  #       만으로도 직선에서 조향이 발산했다 (a053912). max_steer 포화가 유일한
  #       감쇠원이라, 넓히려면 컨트롤러 게인 안정화(gain·steer_lpf)가 선행돼야 한다
  #     · 물리적으로도 이득이 작다: mu 0.40 에서 30.87° 를 유지할 수 있는 속도는
  #       1.47㎧ 뿐이다. 그 이상에서는 명령해도 미끄러진다
  #     · 스토퍼로부터 좌 0.128 / 우 0.062 떨어져 있어 서보 발열도 막는다
  #   → 게인 안정화 후 0.15 를 조금씩 낮추며(= max_steer 확대) 단계 검증할 것.
  servo_min: 0.15
  servo_max: 0.85

geometry:
  wheelbase: 0.33      # 미측정
  mass:      3.354     # 미측정
  lf:        0.1757    # 미측정
  lr:        0.1441    # 미측정

tire:
  mu: 0.348            # 미측정 — η 스윕으로 확인 (그게 곧 μ 측정이다)
  pac_b:  3.8
  pac_c:  1.3
  pac_d:  1.15
  pac_e: -0.5

# ── 튜닝값 — 1호차 검증값에서 출발 ─────────────────────────────────
#   실차 로그로 확인된 값이라 출발점으로 안전하다. 2호차 로그가 쌓이면
#   같은 방법으로 다시 잡을 것:
#     speed_lag  = speed ↔ cmd_v 상호상관 최대 지점
#     slip_gain  = 주행 궤적 곡률 ÷ 기준 곡률 (1.0 이 목표)
#     steer_alpha/l1_k = 직선 구간 δ·헤딩·CTE 주파수 분해
tuning:
  l1_min: 1.4983
  l1_k:   0.75
  steer_alpha: 0.555     # ★ 50Hz 루프 기준 시정수 34ms. 주기가 다르면 환산할 것
  slip_gain:   0.5
  speed_lag:   0.40
  a_lon_acc:   0.0
  a_lon_brk:   0.0
  # ★ 첫 주행은 낮게. 캘리브레이션이 다 끝난 뒤 0.1 씩 올리며 한계를 찾는다.
  grip_util: {q1: 0.5, q2: 0.5, q3: 0.5, race: 0.5}

joystick:
  # ✅ 2026-08-10 실차 확인: false 가 맞다 (스틱 좌 = 앞바퀴 좌).
  #   08-09 에 true 로 잡았던 건 **속도 부호가 뒤집힌 상태에서 봤기 때문**이다.
  #   차가 후진 중에는 스틱을 좌로 밀어도 앞머리가 우로 도는 것처럼 보인다
  #   (후진 주차와 같은 감각). speed_to_erpm_gain 부호를 고치자 이중 반전이 되어
  #   좌우가 바뀌었고, false 로 되돌려 정상 확인했다.
  #   ※ 자율 경로의 조향 부호는 원래 맞았다 — steer_trim 이 수렴한 것이 그 증거다
  #     (부호가 반대면 trim -= damp·L·κ 보정이 반대로 밀려 발산한다).
  steer_invert:   false
  speed_invert:   false     # ★ 게인 부호로 고쳤으므로 여기서 또 뒤집지 말 것
  trigger_invert: true
  device:      /dev/input/js0
  axis_steer:  0
  axis_speed:  5
  btn_reverse: 5
  btn_toggle:  4
  debug:       true

# ── 네트워크 ────────────────────────────────────────────────────────
#   CycloneDDS 가 유니캐스트로 인사할 고정 피어 목록. 상세는 vehicle_car1.yaml 참고.
network:
  peers:
    - 192.168.50.77         # 2호차 젯슨 (2026-08-09 확인)
