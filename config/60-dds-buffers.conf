# DDS(ROS 2) 소켓 버퍼 — /etc/sysctl.d/60-dds-buffers.conf 로 설치할 것
#
#   sudo cp config/60-dds-buffers.conf /etc/sysctl.d/
#   sudo sysctl --system
#
# 왜 필요한가:
#   기본 rmem_max 는 212992(208KB). /map(67KB) 같은 큰 메시지가 조각으로
#   몰려오면 커널 수신 큐가 넘쳐 조각이 버려지고, 조각 하나만 잃어도 메시지
#   전체가 재조립에 실패한다. CycloneDDS 는 SocketReceiveBufferSize 를 요청해도
#   rmem_max 를 넘겨 받지 못하므로 커널 쪽을 먼저 올려야 한다.
#
# 젯슨과 노트북 양쪽에 적용할 것.

net.core.rmem_max = 8388608
net.core.rmem_default = 1048576
net.core.wmem_max = 8388608
net.core.wmem_default = 1048576

# IP 조각 재조립 대기시간을 줄여, 잃어버린 조각을 오래 붙들지 않게 한다
net.ipv4.ipfrag_time = 3
net.ipv4.ipfrag_high_thresh = 8388608
