# ═══════════════════════════════════════════════════════════════════
#  1호차 — 이 차를 **재서 나온 값**만 있다.
#
#  알고리즘 설정은 race_script.yaml 에 있고 두 차가 공유한다.
#  여기 값은 config/apply_vehicle.py 가 vesc.yaml 과 race_script 덮어쓰기로
#  펼친다. 다른 차에 그대로 옮기면 반드시 틀린다.
# ═══════════════════════════════════════════════════════════════════

# ── VESC 캘리브레이션 ──────────────────────────────────────────────
vesc:
  # 줄자 6회 실측 (2026-08-08). 구 4614 는 표시가 실제의 91.1% 였다.
  # IMU·LiDAR 를 전혀 안 쓰는 독립 측정이라 신뢰도가 높다.
  speed_to_erpm_gain: 4203.0

  # IMU 호주행 자동 캘리브레이션 (2026-07-16). 구 설정은 1.6배 과대조향이었다.
  steering_angle_to_servo_gain: -0.761

  # steer_trim.py 자동측정 (2026-08-07, 4회 수렴): 0.425 → 0.3954
  #   ★ 이 값이 움직이면 좌우 조향 한계도 같이 움직인다. apply_vehicle.py 가
  #     max_steer 를 다시 계산하므로 여기만 고치면 된다.
  steering_angle_to_servo_offset: 0.3954

  # 기구 스토퍼 실측 (2026-08-05, vesc_steer_test.yaml 로 락을 풀고 측정):
  #   좌 servo 0.100 / 우 0.860
  # 2026-08-09 에 0.15 → 0.12 로 넓혔다. 0.15 는 스토퍼보다 0.05 안쪽이라
  # 좌 조향을 18.48° 밖에 못 냈는데, 레이싱라인 최소반경이 0.91m 라
  # **속도와 무관하게 헤어핀을 못 돌았다.** 0.12 면 좌 20.73°, R_min 0.856m.
  #   ⚠ 스토퍼 실측이 틀리면 서보가 스톨 전류로 탄다. 바꾼 뒤 첫 주행 전에
  #     ./race.sh box 로 좌우 끝까지 흔들어 소음·발열을 확인할 것.
  servo_min: 0.12
  servo_max: 0.85

# ── 차량 기하 ──────────────────────────────────────────────────────
geometry:
  wheelbase: 0.33
  # 저울 실측 (2026-08-09): 3354g, 앞 1510g / 뒤 1840g
  #   ★ lf/lr 은 조향 계산에서는 약분되지만 **속도 프로파일에서는 아니다** —
  #     후륜구동 가속 한계가 a_g·lf/L 이라 하중분율이 그대로 들어간다.
  mass: 3.354
  lf:   0.1757
  lr:   0.1441

# ── 타이어 ─────────────────────────────────────────────────────────
tire:
  # ★ mu 는 마찰계수가 아니다. 실효 그립 = mu × pac_d 다 (MAP 논문 III-B).
  #   지금:  0.400 × 1.15 = 0.460  (μ_eff)
  #
  #   이력
  #     08-09  η 스윕에서 η=1.0 으로 2.95랩 완주 → μ_eff ≥ 0.400 **확정**
  #            (그 전까지는 추정 0.40±0.08). 한계는 못 짚었다 — 프로파일이
  #            0.400 이상을 요구한 적이 없어서다.
  #     08-10  fun_clean 에서 η=1.0 주행이 깨끗했다:
  #              곡률비 1.00~1.07 (그립 포화 없음)
  #              직선 조향 표준편차 0.049 (진동 없음)
  #              구간 최대 과속 +0.42㎧ (지연 205ms, speed_lag 가 잘 듣는다)
  #              제동 실측 −1.77㎧² — 예산 3.92 의 45% 밖에 안 썼다
  #            여유가 명확해 0.348 → 0.400 으로 올림 (μ_eff 0.400 → 0.460).
  #
  #   ★ 이건 여전히 **하한을 올린 것**이지 한계를 잰 게 아니다. 다음에도
  #     같은 지표가 깨끗하면 더 올릴 수 있다. 나빠지면 되돌릴 것 —
  #     판정 기준은 곡률비(1.0 이탈), CTE p95 초선형 증가, 직선 조향 σ 증가.
  #   ※ 대회 노면(우레탄)은 다르다 — 현장에서 다시 잴 것.
  mu: 0.42
  # Pacejka — [미측정] 초기 추정값이다. On-Track SysID 로 채울 자리.
  pac_b:  3.8
  pac_c:  1.3
  pac_d:  1.15
  pac_e: -0.5

# ── 튜닝값 ─────────────────────────────────────────────────────────
#   차마다 다르지만(질량·관성·구동계), 2호차는 이 값에서 출발한다.
#   전부 실차 로그로 검증된 값이다.
tuning:
  l1_min: 1.3155
  l1_k:   0.75      # 2026-08-09 고속 요 진동 대책 (0.5837 → 0.75)

  # ★★ 이 값은 **제어 루프 주기에 걸려 있다.** 시정수 = -Δt/ln(alpha).
  #    실차 map_controller 는 create_timer(0.02) = 50Hz → 0.555 면 34ms.
  #    시뮬은 250Hz 라 같은 숫자가 7ms 다. 옵티마이저 결과를 그대로 옮기면
  #    안 되고 시정수로 환산해야 한다 (2026-08-09 요 진동의 최대 지연원이었다).
  steer_alpha: 0.6267

  # Pacejka 슬립보정 α_f 이득. 1.0 = 모델값. 2026-08-09 에 코너에서 주행
  # 곡률이 기준의 1.2~1.9배로 파고들어 0.5 로 낮췄다 → 1.00~1.07 로 정상화.
  slip_gain: 0.4358

  # 구동계 지연 [s]. 지령↔실측 상호상관 실측 (406~440ms). 감속만 앞당긴다.
  speed_lag: 0.40

  # 종방향 상한. 0 = 물리에서 자동 유도 (가속 a_g·lf/L, 제동 a_g)
  #
  # ★ 이력 — 값을 고정하면 μ 를 바꿀 때 같이 안 움직여 조용히 어긋난다
  #   08-10  1.6 으로 고정. 근거: 자동 유도가 2.48㎧² 인데 실측 급가속은
  #          1.61 이라 **낼 수 없는 가속을 1.5배로 요구**하고 있었고, 그 차이가
  #          휠 스핀으로 나가 위치추정을 오염시켰다 (허위거리 87cm).
  #   08-15  다시 0(자동). **그 1.6 은 μ=0.348 기준이었다.** μ 를 0.42 로
  #          올리면서 이 값을 같이 안 봤다. 지금 자동 유도는 2.60㎧² 다.
  #          그 사이 주행의 **96% 가 종가속 제한에 물려** 최고 4.63㎧ 에서
  #          막혔고, grip_util 을 1.0 으로 올려도 아무 변화가 없었다
  #          (η 는 코너 속도만 정한다. 곡률에 물린 구간은 4% 뿐이었다).
  #            a_lon_acc  v최대   랩
  #              1.60     4.63  6.44s
  #              2.60     5.20  6.17s   ← 자동
  #
  #   ⚠ 08-10 의 휠 스핀이 다시 나올 수 있다. 다음 주행 bag 에서
  #     odom 이동거리 ÷ AMCL 이동거리를 가속도별로 볼 것 — 급가속 구간이
  #     1.05 를 넘으면 스핀이다 (08-10 실측 1.069). 그러면 2.0 근처로 고정한다.
  a_lon_acc: 0.0
  a_lon_brk: 0.0

  # ★ 출발 직후만 가속을 더 조인다 [㎧²]. 0 = 끔.
  #   프로파일의 a_lon_acc 와 왜 따로 두나 — **출발이 특별하기 때문**이다.
  #   같은 가속도인데도 정지에서 뗀 5초 안쪽이 훨씬 더 미끄러진다
  #   (실측표와 논거는 speed_profile.LaunchLimiter). 정지마찰을 깨는 순간,
  #   구동계 백래시, 하중이 뒤로 쏠리며 앞이 뜨는 것이 겹친다.
  #   그 스핀이 odom 거리 과대보고 → 종방향 위치 오차 → 첫 코너 조기 진입.
  #   launch_time 에 걸쳐 a_lon_acc 로 선형 복귀한다. 감속에는 안 건다.
  #   2026-08-10: 실측 급가속 구간 비율 1.069 → 0.8 로 시작.
  #   비용 +1.16s (1랩, η=0.6). 누적 안 됨 — 3랩에서도 +1.20s.
  #   근거와 스윕표는 race_script.yaml [limits] 절 참고.
  launch_acc:  0.8
  launch_time: 3.0
  #   실측(2026-08-09)이 자동 유도값과 잘 맞았다:
  #     가속 p95 +1.7~2.4 (유도 1.72) / 제동 p5 −2.6~−3.2 (유도 3.14)

  # 마찰 예산 사용률. 유일한 속도 노브다 (v ∝ √η).
  grip_util: {q1: 1.0, q2: 1.0, q3: 1.0, race: 1.0}

# ── 조이스틱 (패드 개체차 + 서보 결선) ─────────────────────────────
joystick:
  steer_invert:   false
  speed_invert:   false
  trigger_invert: true      # /joy 기준: 안 누름 +1, 끝까지 −1
  device:      /dev/input/js0
  axis_steer:  0
  axis_speed:  5
  btn_reverse: 5
  btn_toggle:  4

# ── 위치추정 ────────────────────────────────────────────────────────
localization:
  # /odom 병진 속도 부호. imu_odom 이 이 값으로 위치를 적분해
  # odom→base_link TF 를 낸다 = SLAM·AMCL 이 실제로 보는 것.
  #   +1.0  들어온 그대로 (기본)
  #   -1.0  뒤집는다
  # ★ 반드시 실측으로 정할 것 — 차를 손으로 앞으로 밀면서
  #     ros2 topic echo /odom_imu --field twist.twist.linear.x
  #   가 **양수**여야 한다. 음수면 -1.0 으로.
  #   틀리면 SLAM 이 전진을 후진으로 받아 맵이 통째로 깨진다.
  speed_sign: 1.0

# ── 네트워크 ────────────────────────────────────────────────────────
#   CycloneDDS 가 유니캐스트로 인사할 고정 피어 목록. 젯슨 IP 는 차마다 다르므로
#   여기서 분리한다 — race_script.yaml 에 두면 두 차가 머지할 때마다 충돌하고,
#   남의 차 IP 가 들어가면 노트북 RViz 가 조용히 먹통이 된다.
#   ※ 노트북은 안 적어도 된다: 노트북이 젯슨에게 유니캐스트로 인사하면 그 패킷에
#     노트북 주소가 들어 있어 젯슨이 배운다. 끝자리가 매번 바뀌어도 괜찮다.
network:
  # ★ ROS_DOMAIN_ID — 두 차가 같은 공유기에 있어도 DDS 레벨에서 완전히 격리된다.
  #   peers 가 안 겹쳐서 "우연히" 안 섞이는 것과 달리, 도메인이 다르면 멀티캐스트
  #   그룹과 포트 대역 자체가 달라 /scan·/map·/tf 가 절대 안 섞이고 노드 이름
  #   충돌도 없다. 값은 **젯슨 IP 끝자리와 같게** 둔다 (외우기 쉽다).
  #   ROS_DOMAIN_ID 유효범위 0~101 안이라 안전하다.
  #   노트북에서 붙을 때:  ./rviz.sh 57
  #   ※ 2026-08-10 도입 전에는 두 차 모두 기본값 0 이었다. 젯슨과 노트북이
  #     **양쪽 다** git pull 해야 서로 보인다 — 한쪽만 갱신하면 통신이 0 이 된다.
  domain_id: 57
  peers:
    - 192.168.50.57         # 1호차 젯슨 (2026-08-03 공유기 교체로 변경)
