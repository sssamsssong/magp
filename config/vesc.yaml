/**:
  # general parameters shared by all vesc-related nodes
  ros__parameters:
    # erpm (electrical rpm) = speed_to_erpm_gain * speed (meters / second) + speed_to_erpm_offset
    # ★ 2026-08-09 줄자 실측(odom_scale, 6회): 표시 속도가 실제의 91.1% 였다.
    #   4614 × 0.911 = 4203. 이 값을 쓰면 표시 = 실제가 된다.
    #   같은 지령에 차는 약 9% **느려진다** (그동안 계획보다 빨리 달리고 있었다).
    #   근거: a_y 대 v·ω 불일치를 파다가 발견했고, IMU·LiDAR 를 전혀 안 쓰는
    #   줄자 측정으로 독립 검증했다. 6회 산포가 작았다.
    #   ※ 이 값을 바꾸면 speed_scale(=0.911) 을 쓰던 곳은 전부 1.0 으로
    #     되돌려야 한다 — 안 그러면 이중 보정된다.
    # ★ 2026-08-09 (2호차): 부호를 반전했다 — 이 차는 모터 결선이 1호차와 반대라
    #   양수 speed 지령이 **후진**이었다. 자율 노드(map_controller/steer_trim)가
    #   전부 뒤로 갔고, vesc_to_odom 도 같은 게인을 쓰므로 물리적 전진을 "후진"으로
    #   보고해 SLAM 맵이 통째로 깨졌다(방사형 부채꼴).
    #   조이스틱만 joystick.speed_invert:true 로 덮여 있어 정상처럼 보였다 —
    #   그 야매 보정은 이 수정과 함께 false 로 되돌렸다(이중 반전 방지).
    #   ※ 1호차는 +4203 이 맞다. 차량별 값이므로 main 에 올리지 말 것.
    speed_to_erpm_gain: -4203.0   # 크기는 1호차 실측 그대로, 부호만 2호차용

    speed_to_erpm_offset: 0.0

    # servo value (0 to 1) =  steering_angle_to_servo_gain * steering angle (radians) + steering_angle_to_servo_offset
    # 2026-07-16 IMU 호주행 캘리브레이션: 실제 = 1.594×명령 + 0.032 (구 -1.2135/0.40)
    #   좌 기구락 servo 0.15 = 0.361rad, 우 락 0.85 = 0.558rad → max_steer ≤ 0.35 권장
    steering_angle_to_servo_gain: -0.761
    # 실측 중립은 0.419 지만 그 값으로 주행하니 직선에서 조향이 발산했다.
    # 백래시 가설 검증 전까지 0.425 유지 (자세한 내용은 업데이트노트 08-05).
    # 2026-08-07 steer_trim.py 자동측정: 0.4250 → 0.4249 (trim=+0.0001rad, iter=1)
    # 2026-08-07 steer_trim.py 자동측정: 0.4249 → 0.4249 (trim=-0.0000rad, iter=1)
    # 2026-08-07 steer_trim.py 자동측정: 0.4249 → 0.4041 (trim=+0.0273rad, iter=3)
    # 2026-08-07 steer_trim.py 자동측정: 0.4041 → 0.3954 (trim=+0.0114rad, iter=1)
    steering_angle_to_servo_offset: 0.3954

    port: /dev/sensors/vesc
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 100.0
    brake_min: -20000.0
    brake_max: 200000.0
    speed_min: -50000.0
    speed_max: 50000.0
    position_min: 0.0
    position_max: 0.0
    # ★ 2026-08-05 실측: 좌 기구 스토퍼가 서보 0.100, 우가 0.860 이었다.
    #   기존 0.15/0.85 중 좌측이 0.05 만큼 보수적이라 좌회전 4.1° 를 못 쓰고 있었다.
    #   (측정: config/vesc_steer_test.yaml 로 락을 풀고 steer_limit_check.py)
    #   스토퍼를 직접 밀지 않도록 0.01 여유를 두고 0.11 로 설정.
    servo_min: 0.15
    servo_max: 0.85

# No longer needed, all parameters are shared
# ackermann_to_vesc_node:
#   ros__parameters:

vesc_to_odom_node:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    # ★ 2026-08-03: odom→base_link TF 발행을 race_stack 의 imu_odom 노드로 넘겼다.
    #   AMCL·slam_toolbox 는 /odom 토픽이 아니라 이 TF 를 본다. 여기서 true 로 두면
    #   같은 transform 을 두 노드가 발행해 TF 트리가 깨진다 (둘이 번갈아 이겨서
    #   위치가 튄다). imu_odom 은 이 노드의 /odom 을 받아 yaw 만 자이로로 바꿔
    #   다시 발행한다.
    #   ※ 이 값이 false 인 상태에서 imu_odom 없이 bringup 만 띄우면 odom TF 가
    #     아예 없다. race.launch.py / mapping.launch.py 는 항상 같이 띄운다.
    publish_tf: false
    use_servo_cmd_to_calc_angular_velocity: true
    # measured axle-to-axle on this car: 33cm
    wheelbase: 0.33

# No longer needed, all parameters are shared
# vesc_driver:
#   ros__parameters:

throttle_interpolator:
  ros__parameters:
    rpm_input_topic: commands/motor/unsmoothed_speed
    rpm_output_topic: commands/motor/speed
    servo_input_topic: commands/servo/unsmoothed_position
    servo_output_topic: commands/servo/position

    # servo smoother - limits acceleration and smooths anything above limit
    max_acceleration: 2.5 # meters/second^2
    throttle_smoother_rate: 75.0 # messages/sec
    # servo smoother - limits rotation speed and smooths anything above limit
    max_servo_speed: 3.2 # radians/second
    servo_smoother_rate: 75.0 # messages/sec
