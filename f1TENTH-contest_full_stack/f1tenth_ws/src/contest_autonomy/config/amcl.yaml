amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    set_initial_pose: true
    always_reset_initial_pose: false
    tf_broadcast: true
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field_prob
    min_particles: 800
    max_particles: 3000
    max_beams: 90
    laser_min_range: 0.06
    laser_max_range: 20.0
    laser_likelihood_max_dist: 2.0
    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 1
    transform_tolerance: 0.3
    alpha1: 0.12
    alpha2: 0.12
    alpha3: 0.10
    alpha4: 0.10
    alpha5: 0.10
