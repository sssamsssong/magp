vesc_driver:
  ros__parameters:
    # 시리얼 포트 설정
    port: "/dev/ttyACM0"

    # 속도 및 제어 제한
    speed_to_erpm_gain: 4614.0  # 모터에 따라 조정
    speed_to_erpm_offset: 0.0

    # 조향 설정
    steering_angle_to_servo_gain: -1.0
    steering_angle_to_servo_offset: 0.5

    # 안전 제한
    speed_min: -1.0  # m/s
    speed_max: 1.0   # m/s
    servo_min: 0.0
    servo_max: 1.0

    # 제어 모드
    use_servo_cmd: true
