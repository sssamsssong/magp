amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "scan"

    # 파티클 수: 많을수록 정확하지만 느림 (Orin NX면 여유 있음)
    min_particles: 500
    max_particles: 2000

    # 레이저 모델
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 20.0
    laser_min_range: 0.06
    # ★ 60 → 180 (2026-08-04). 빔이 적으면 스캔이 "대충 비슷한" 여러 자세를
    #   비슷한 점수로 만든다 — 폭이 일정한 트랙에서는 몇 미터 어긋난 자세도
    #   비슷해 보인다. 실제로 위치가 1.98m 순간이동해 **벽 안쪽**으로 들어갔다
    #   (주행 로그 20260804_223248: 점프 후 20개 점이 전부 픽셀값 0).
    #   빔을 늘리면 그 구분이 살아난다. Orin 은 여유가 충분하다.
    max_beams: 180

    # 모션 모델: 애커만 차량이지만 AMCL은 diff 모델로 근사 (odom이 정확하면 OK)
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # ★ 0.2 → 0.05/0.1 (2026-08-04). 이 값은 "odom 을 얼마나 못 믿는가" 다.
    #   08/03 에 yaw 를 자이로 실측으로 바꾸고 회전 스케일 오차 0.30% 까지
    #   확인했으므로, 예전만큼 의심할 이유가 없다. 크게 두면 파티클이 넓게
    #   퍼지고, 그만큼 **스캔이 엉뚱한 자세를 골라 튈 여지**가 생긴다.
    #   회전 쪽(alpha1/2)을 특히 조인다 — 자이로가 가장 믿을 만한 성분이다.
    alpha1: 0.05  # 회전→회전 노이즈 (자이로 실측이라 작게)
    alpha2: 0.05  # 병진→회전 노이즈
    # ★ 0.10 → 0.03 (2026-08-10). "거리는 아직 미검증" 이라 크게 뒀던 값인데,
    #   08/08 에 줄자 6회로 speed_to_erpm_gain 을 8.9% 보정했다. 이제 병진도
    #   회전만큼 믿을 만하다.
    #
    #   ★★ 그런데 **되돌렸다 (0.03 → 0.12).** 종방향에 두 요인이 맞선다:
    #
    #     (가) 진행방향은 **관측되지 않는다.** 08/10 실측: 스캔을 진행방향으로
    #          20cm 흔들어도 비용이 0.2~1.0cm 밖에 안 는다(옆방향 6~7cm).
    #          s=12·16m 는 양방향 다 0.09cm 로 사실상 관측 불가 — 실제로
    #          s=13.5m 에서 2.44m 점프가 났다. 이것만 보면 odom 을 믿어야 한다.
    #
    #     (나) 그런데 **odom 이 가속 중에 거리를 과대보고한다** (휠 스핀).
    #          AMCL 보정의 종방향 성분을 가속도별로 재보니:
    #            감속 −1.3 / 정속 −7.4 / 약가속 −8.4 / 급가속 −15.1 cm/s
    #          전부 음수 = AMCL 이 "너무 앞서 갔다" 며 계속 뒤로 당긴다.
    #          가속이 셀수록 강해지고, 횡방향은 부호도 크기도 일정치 않다.
    #          → 종방향에만 있는 **계통 오차**다.
    #          08/08 슬립 분석의 "휠이 1.21배 빨리 돈다" 와 같은 현상이다.
    #
    #     odom 이 계통적으로 틀리는데 alpha3 를 조이면 **틀린 값을 더 믿게** 된다.
    #     출발 급가속 뒤 위치가 앞서 나가 코너를 일찍 도는 증상이 그것이다.
    #     관측이 없어도 AMCL 이 이 편향만큼은 되돌릴 수 있어야 하므로 크게 둔다.
    #
    #   ※ 근본 해결은 odom 을 고치는 것이다 (휠 스핀 검출·보정). IMU 로 검증하려
    #     했으나 6축이라 피치와 종가속을 구분 못 해 결론이 안 났다.
    #     당장은 a_lon_acc 로 가속을 제한해 스핀 자체를 줄이는 편이 빠르다.
    alpha3: 0.12  # 병진→병진 노이즈 (휠 스핀 계통오차 때문에 크게)
    alpha4: 0.05  # 회전→병진 노이즈

    # 업데이트 조건 — 사실상 매 스캔 갱신 (컨트롤러의 amcl 보정 주기를 올림.
    # Orin CPU 여유 충분. 정지 중엔 어차피 안 돌아 부하 없음)
    update_min_d: 0.025   # 2.5cm 이동마다
    update_min_a: 0.03    # ~1.7도 회전마다
    resample_interval: 1

    transform_tolerance: 0.5
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    # 초기 포즈는 launch에서 주입 (set_initial_pose: true)
    always_reset_initial_pose: false
    tf_broadcast: true
