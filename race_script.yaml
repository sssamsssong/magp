# ============================================================
#  race_script.yaml  —  ★ 팀원이 수정하는 유일한 파일 ★
#
#  이 파일만 바꾸고  ./race.sh  실행하면 끝.
#  코드 수정 / colcon build 필요 없음.
# ============================================================

# ========================================================================
#  1. 매 주행 바꾸는 것
# ========================================================================


# ------------------------------------------------------------
# 주행 모드  (아래 중 하나)
#    mapping : SLAM으로 맵 생성 (키보드/조종기로 수동 주행)
#    q1      : 예선1 - 장애물 없음, 레이싱라인 고속 추종 (pure_pursuit)
#    q2      : 예선2 - 정적 장애물 회피 (gap_follower / disparity extender)
#    q3      : 예선3 - 최소 랩타임, 공격적 속도 (pure_pursuit)
#    race    : 1대1 경주 - 장애물+상대차량 회피 (gap_follower)
# ------------------------------------------------------------
mode: q1

# ------------------------------------------------------------
# 맵 / 웨이포인트
#    맵 파일:  race_stack/maps/<map_name>.yaml + .png(.pgm)
#    (주최측 배포 맵을 maps/ 폴더에 넣고 이름만 적으면 됨)
#    웨이포인트: race_stack/waypoints/<waypoints>.csv  (x,y,speed)
# ------------------------------------------------------------
# ★ 2026-08-13 (2호차): map_0813 으로 전환. 1호차는 fun_clean 을 쓴다 —
#   이 두 줄은 아직 차량별로 안 나뉘어 있으니, 상대 차가 쓸 때 되돌릴 것.
map_name: map_0813_clean

waypoints: map_0813_clean_wp_kappa
#   ★ 라인을 바꾸거나 새로 만들면 **차가 그 곡률을 낼 수 있는지** 확인할 것.
#     좌 조향 한계 20.73° → 최소회전반경 0.856m (config/vesc.yaml 참고).
#     gen_raceline 이 생성 끝에 자동으로 검사해 "못 도는 점 N개"를 띄운다.
#
#       halfhot_clean_map_wp   R_min 1.001m  못도는점 0   벽여유 0.061m   ← 현재
#       halfhot_forza_opt_wp   R_min 0.782m  못도는점 2   벽여유 0.060m
#
#     되돌리려면 이 줄만 바꾸면 된다.

# ------------------------------------------------------------
# 컨트롤러 선택
#    auto         = 모드에 따라 자동 (q1/q3→pure_pursuit, q2/race→gap_follower)
#    stanley      = Q1/Q2/Q3 모두 Stanley 컨트롤러 사용 (아래 [stanley] 섹션 참조)
#    pure_pursuit = 강제로 Pure Pursuit
#    gap_follower = 강제로 Gap Follower
#    map          = MAP 컨트롤러 (아래 [map] 섹션 참조)
#                   ※ 'MAP' 은 알고리즘 이름(Model-based Adaptive Pure pursuit)
#                     이고 위의 map_name(트랙 맵)과는 아무 상관 없다.
#
#    ★ 한 줄 고치기 싫으면 실행할 때 인자로 덮어쓸 수 있다:
#         ./race.sh q3 map          ./race.sh q1 stanley
# ------------------------------------------------------------
controller: map             # auto | stanley | pure_pursuit | gap_follower | map


# ╔══════════════════════════════════════════════════════════════════╗
# ║ ★ 아래 절들 중 **차량 물리·튜닝 값**은 config/vehicle_<차>.yaml 이  ║
# ║   덮어쓴다. 젯슨에서는 여기를 고쳐도 안 먹는다.                    ║
# ║     map:  mu pac_* mass lf lr l1_min l1_k steer_alpha slip_gain    ║
# ║     limits: grip_util a_lon_* speed_lag                            ║
# ║     pure_pursuit: wheelbase max_steer(자동계산)                    ║
# ║     joystick: 전부                                                 ║
# ║   여기 남겨둔 값은 **시뮬(노트북)이 읽는 기본값**이다 — 노트북은     ║
# ║   차량 파일을 안 쓰므로 지우면 시뮬이 깨진다.                       ║
# ║   두 쪽 값이 갈라지면 기동 로그가 경고한다([vehicle] ⚠ 줄).         ║
# ╚══════════════════════════════════════════════════════════════════╝

# ========================================================================
#  2. 속도 — 물리 기반 프로파일
# ========================================================================

# ------------------------------------------------------------
# 속도 설정 (m/s)
#
#  ★★ 자율주행 속도는 **여기서 정하지 않는다.**  아래 [limits] 의 grip_util 이
#     유일한 노브다. map / stanley / gap_follower 셋 다 같은 물리로 푼다
#     (speed_profile 모듈 공용).
#
#     이 절에 남은 건 셋뿐이다:
#       mapping_max — 맵핑 텔레옵 전용 (자율주행과 무관)
#       min_speed   — 하드웨어 바닥 (모터 코깅·곡률 스파이크 방지)
#       hard_cap    — 물리 무관 안전 천장 (0 = 끔)
#
#  ※ 여기 숫자는 **실제 속도**다 (2026-08-09 오도메트리 보정 완료.
#    그 전에는 표시가 실제보다 9% 낮았다 — 옛 로그를 볼 때만 주의).
# ------------------------------------------------------------
speed:
  mapping_max: 1.0          # 맵핑 시 키보드 텔레옵 최고속도 (자율주행과 무관)

  # ★ 이건 "코너 최저속도" 라기보다 **하드웨어 바닥**이다. 지우지 않았다:
  #   · VESC 가 센서리스라 erpm 이 너무 낮으면 코깅해서 아예 못 민다.
  #     0.3㎧ = 1261 erpm 으로 그 경계 근처다.
  #   · 웨이포인트 간격이 촘촘하면 곡률(2차 미분)이 수치적으로 튀는데,
  #     그때 v = √(a_g/κ) 가 0 으로 가서 코너 한복판에서 차가 선다.
  #   정말 끄고 싶으면 0 으로 두면 된다. 프로파일 **맨 마지막에** 적용된다
  #   (패스 도중에 올리면 제동 제약이 깨진다).
  min_speed: 0.3

  # 물리와 무관한 안전 천장. **0 = 끔(기본).**
  #   μ 나 grip_util 이 틀려도 이 속도는 절대 안 넘는다는 마지막 방어선이다.
  #   첫 고속 주행처럼 물리 가정을 아직 못 믿을 때만 켠다. 켜면 기동 로그에
  #   "hard_cap 에 걸린 구간 N%" 가 뜨므로 물고 있는지 바로 보인다.
  #   ※ 지금 8.0 은 프로파일 최고(η=0.8 에서 5.07㎧)보다 훨씬 높아 **한 점도
  #     물지 않는다** — 사실상 꺼진 상태다. 진짜 천장이 필요하면 5.0 근처로.
  hard_cap: 4

# ------------------------------------------------------------
# 물리 한계 — 컨트롤러 공용 속도 프로파일
#
#  ★★ grip_util(η) 이 **유일한 속도 노브**다. map / stanley / gap_follower 가
#     전부 이 값을 쓴다 (같은 speed_profile 모듈).
#
#  왜 상한이 아니라 이걸 쓰나:
#    max_speed 가 CSV 속도보다 낮으면 **전 구간이 그 값으로 잘려 등속 주행**이
#    된다. 2026-08-09 이전 Stanley 가 정확히 그 상태였다 — q1_max=1 인데 CSV 는
#    0.75~6.0㎧ 라서 직선에서도 코너에서도 똑같이 1㎧ 로 돌았다.
#
#    속도를 배수로 스케일하는 것도 답이 아니다. 속도를 k 배 하면 요구 횡가속
#    (v²κ)은 **k² 배**가 되어 비선형이고, 어느 코너가 한계인지까지 바뀐다.
#
#    그래서 속도가 아니라 **마찰 예산**에 η 를 곱한다:
#        a_g = η · μ_eff · g        (μ_eff = map.mu × map.pac_d = 0.400)
#    v ∝ √η 라 코너는 √η 배로 줄지만 직선은 종가속과 구간 길이가 지배해
#    균일하게 안 줄어든다. 그게 물리적으로 맞다.
#
#  현재 라인(halfhot_clean_map_wp, 27.7m) 프로파일 — μ_eff 0.400 기준:
#      η 0.4 → 13.2s   0.5 → 11.8s   0.6 → 10.8s   0.7 → 10.0s
#        0.8 →  9.4s   0.9 →  8.8s   1.0 →  8.4s      (예상 랩타임)
#
#  ▶ 실험 절차: 0.5 에서 시작해 0.1 씩 올린다. 아래 중 하나라도 나오면 정지:
#      · 실측 a_lat(=v·ω) 이 지령보다 낮은 곳에서 평평해짐   ← 그립 포화
#      · 횡추종오차가 초선형으로 증가
#      · 언더스티어비(ω_실측/ω_기구학)가 벌어짐
#    대회는 그 한계 × 0.85.   ※ 이 스윕이 곧 μ 재측정이기도 하다.
# ------------------------------------------------------------
limits:
  # 숫자 하나로 줘도 되고(grip_util: 0.6), 아래처럼 모드별로 나눠 줘도 된다.
  #   ※ default 키는 두지 말 것. 네 모드가 다 있으면 영원히 안 읽히는데 값이
  #     남아 있으면 손대게 된다 — 옵티마이저가 default 에 쓰고 주행은 모드 키를
  #     읽어 결과가 통째로 무시된 적이 있다 (docs/grip_util_shadowing.md).
  grip_util:
    q1: 0.1           # 08/09 실차 완주 검증값 (중앙 3.22㎧, 최고 5.07)
    q2: 0.7                 # 장애물 회피 — 여유를 더 둔다 (중앙 2.54㎧)
                            #   ※ 회피 여유는 속도를 죽여서가 아니라 호라이즌
                            #     (아래 frenet 절)으로 버는 쪽이 맞다
    q3: 0.75                # 기록 주행
    race: 0.6               # 1대1

  # 종방향 상한 [㎧²]. 0 = 물리에서 자동 유도:
  #   가속 — 후륜구동이라 후축 하중분율이 한계.  a = a_g · lf/L
  #   제동 — 네 바퀴를 다 쓰므로 예산 전체.       a = a_g
  #   ※ 2026-08-09 실측(4주행): 가속 p95 +1.9~2.4, 제동 p5 −2.6~−3.2㎧².
  #     자동 유도값(1.72 / 3.14)과 잘 맞는다 — 그대로 둔다.
  a_lon_acc: 0.0
  a_lon_brk: 0.0

  # ── 출발 직후만 따로 더 조인다 ────────────────────────────────────
  #   왜 a_lon_acc 로 충분하지 않은가 — **출발이 특별하기 때문**이다.
  #
  #   2026-08-10 실측 (bag 16개). 프레임에 무관한 지표로 쟀다:
  #   0.6초 창에서 odom 이 말하는 이동거리 ÷ AMCL 이 말하는 이동거리.
  #   1보다 크면 바퀴가 헛돈 것이다.
  #
  #      가속도        출발 0~5s    5s 이후     차이
  #      0.0~0.8        1.0332      1.0246     +0.86%
  #      0.8~1.6        1.0344      1.0268     +0.76%
  #      1.6 이상       1.0694      1.0360     +3.34%   ← 두 배로 미끄러진다
  #
  #   **같은 가속도인데도 출발 5초 안쪽이 더 미끄러진다.** 정지마찰을 깨는
  #   순간, 구동계 백래시, 하중이 뒤로 쏠리며 앞이 뜨는 것이 겹치는 구간이다.
  #
  #   결과: 출발 5초에 **허위거리 87cm** (odom 17.35m vs AMCL 16.35m).
  #   종방향은 복도에서 거의 관측되지 않으므로(앞뒤 0.2~1.0cm vs 좌우 6~7cm)
  #   AMCL 이 다 못 되돌리고 자세에 남는다 → 차가 "실제보다 더 갔다"고 믿어
  #   **첫 코너를 일찍 돈다.** 출발선이 직선 한가운데라 매 주행 첫 코너가
  #   그렇게 망가지고 있었다.
  #
  #   launch_acc 에서 시작해 launch_time 에 걸쳐 a_lon_acc 로 선형 복귀한다.
  #   계단으로 풀면 그 순간 다시 스핀이 나서 하는 일이 없어진다.
  #   감속에는 걸지 않는다. 0 = 끔.
  #   ※ 공짜가 아니다. 프로파일 적분으로 잰 비용 (fun_clean, η=0.6):
  #        제한 없음      1랩 15.64s
  #        0.8㎧² / 3s   1랩 16.80s   (+1.16s)
  #      **누적되지는 않는다** — 3랩에서도 +1.20s 다. 출발 한 번의 값이다.
  #      창 길이는 거의 무의미하다 (1.5s 든 3.0s 든 0.1s 차이). 프로파일 자신의
  #      a_lon_acc 로 금방 복귀하기 때문이다. 실제 노브는 launch_acc 하나다.
  #        0.6→+1.30s   0.8→+1.16s   1.0→+1.02s   1.2→+0.90s
  #      0.8 로 시작하는 이유: 실측에서 1.6㎧² 이상이 명확히 나쁘고(1.069),
  #      0.8~1.6 구간은 1.034 로 같아 그 아래를 더 파도 근거가 없다. μ 때처럼
  #      **되면 올리는** 방식으로 간다 — 종방향 편향이 줄면 1.2 까지 올려볼 것.
  launch_acc:  0.8
  launch_time: 3.0

  # 구동계 지연 [s] — 지령 속도가 실제로 나오기까지 걸리는 시간.
  #   2026-08-09 실측: 지령↔실측 상호상관 최대가 250~290ms (r=0.95~0.98).
  #   4.7㎧ 면 1.2m 를 더 가서야 반응하므로, 헤어핀 진입에서 프로파일이 2.09㎧
  #   를 지시했는데 실제로는 3.30㎧ 로 들어가 라인 바깥으로 0.39m 밀렸다.
  #   컨트롤러가 이만큼 앞의 프로파일 **최솟값**을 미리 지령해 감속을 앞당긴다
  #   (가속은 앞당기지 않는다 — 코너를 다 빠져나오기 전에 밟으면 마찰원을 넘는다).
  #   0 = 끔.
  #
  #   ★ 2026-08-09 재실측 (cool_clean, 최고 5.4㎧): **410ms** (r=0.96).
  #     속도가 오르니 지연도 늘었다(halfhot 저속에선 250~290ms).
  #     0.25 로는 모자라 코너 진입에서 지령보다 1.0~1.6㎧ 빠르게 들어갔다:
  #        s=16m  지령 3.24 → 실측 4.25
  #        s=40m  지령 3.16 → 실측 4.13
  #        s=44m  지령 1.59 → 실측 3.19   ← 2배. 여기서 라인 밖으로 밀렸다
  #     제동 자체는 문제없다 (실측 최대 −3.8㎧², η=0.7 예산 2.75 이상 낸다).
  #     늦게 시작하는 게 문제다.
  speed_lag: 0.40


# ========================================================================
#  3. 컨트롤러 파라미터
# ========================================================================

# ------------------------------------------------------------
# MAP 컨트롤러 파라미터 (controller: map 일 때 사용)
#
#   MAP = Model-based Adaptive Pure pursuit. 트랙 맵(map_name)과 무관한
#   알고리즘 이름이다. 시뮬 번들에서 고속주행용으로 개발한 것을 실차로 옮겼다.
#   원본: f1TENTH-contest_full_stack/.../f1tenth_racing/map_controller_node.py
#   참고: ETH-PBL MAP-Controller (github.com/ETH-PBL/MAP-Controller)
#
#   Pure Pursuit 과 뭐가 다른가:
#     · 전방주시거리를 L1 = max(l1_min, l1_k × 속도) 로 잡는다 (짧다 — 고속용)
#     · 기구학 조향각에 **타이어 슬립각 보정**을 더한다. Pacejka 타이어 모델을
#       역산해 "이 횡가속도를 내려면 앞바퀴를 얼마나 더 꺾어야 하는가"를 구한다.
#       고속 코너에서 언더스티어로 바깥으로 밀리는 걸 미리 보상하는 항이다.
#     · CSV 속도를 역방향 스윕(a_brake)해서 코너 진입 전에 미리 감속한다.
#
#   ★ 속도는 이 절이 아니라 [limits] 의 grip_util 이 정한다. CSV 속도는
#     **상한으로만** 쓰인다 (설계자가 의도적으로 낮춰둔 구간은 존중).
#
#   ★ 차량 기하(wheelbase / max_steer)는 아래 [pure_pursuit] 절 값을 그대로 쓴다.
#     같은 차인데 두 군데서 따로 관리하면 반드시 어긋난다.
#
#   ▶ 새 트랙·새 라인에서의 시험 순서 (권장)
#     1. ./race.sh box  로 박스 위에서 조향 방향·크기만 확인 (바퀴 안 돎)
#     2. limits.grip_util 을 0.5 로 낮춘 채  ./race.sh q1 map
#     3. RViz 에서 /car_path(실주행)와 /waypoints_path(레이싱라인) 벌어짐 확인
#     4. 잘 붙으면 grip_util 을 0.1 씩 올린다 (판정 기준은 [limits] 절 참고)
# ------------------------------------------------------------
map:
  # ── L1 가이던스 (전방주시거리) ───────────────────────────
  #   L1 = max(l1_min, l1_k × 현재속도)
  #
  #   ★★ 짧은 L1 을 실차에 쓰지 말 것. 조향각이
  #   delta = atan(2 × 휠베이스 × sin(방위오차) / L1) 이라 L1 이 짧을수록
  #   이득이 폭증한다:
  #       L1 0.41m (옛 시뮬 기본값) → atan(1.61·sinθ) → θ 13도에서 이미 풀조향
  #       L1 1.50m (아래 값, 저속)  → atan(0.44·sinθ) → θ 13도에서 5.7도
  #   시뮬은 pose 가 완벽해서 버텼지만, 실차는 AMCL 튐만으로 그 13도를 넘나들어
  #   좌우 풀조향이 반복된다 — 2026-08-06 저속 시험의 **사인파 진동**이 이것이다.
  #   여전히 흔들리면 l1_min 을 0.1씩 올린다 (라인 추종은 조금 무뎌진다).
  #   ※ l1_min 은 시뮬 재최적화 결과다 (속도지연 tau_v 0.40 반영 후 재최적화 예정).
  l1_min: 1.4983            # 정지~저속에서의 최소 L1 (m)

  #   ★ 2026-08-09 실차 (cool_clean): l1_k 0.5837 → 0.75.
  #     고속 직선에서 요가 한계 사이클로 흔들렸다 — 조향·헤딩·CTE 가 **같은
  #     주파수**로 함께 진동하고 속도에 따라 진폭이 커졌다(잡음이 아니다):
  #        3.1㎧: δ 3.66° / 헤딩 3.88° / CTE 3.9cm  @ 0.68Hz
  #        4.0㎧: δ 6.42° / 헤딩 7.70° / CTE 12.2cm @ 0.51Hz
  #     원인은 슬립보정 α_f 다. a_lat = 2v²sinη/L1 에 L1 = l1_k·v 를 넣으면
  #     a_lat ∝ v 라 α_f 가 속도에 비례해 커진다. L1 법칙 자체는 속도무관하게
  #     설계돼 있는데(δ_kin 은 오히려 줄어든다) α_f 가 그걸 깬다:
  #        헤딩오차 1rad 당   2㎧: δ_kin 0.440 / α_f 0.275  (α_f 가 0.6배)
  #                          4㎧: δ_kin 0.283 / α_f 0.707  (2.5배)
  #                          6㎧: δ_kin 0.188 / α_f 1.060  (5.6배)
  #     l1_k 를 올리면 두 항 모두 1/l1_k 로 줄어든다 → 이득 22% 감소.
  #     ※ 저속 코너는 L1 이 l1_min 에 걸려 있어(v < 2.0㎧) 영향이 없다.
  #       손해 보는 건 고속 구간의 라인 추종 예민함뿐이다.
  l1_k: 0.75                # 속도 비례 계수 (s). 3㎧ → 2.25m, 5㎧ → 3.75m

  # ── 조향 필터 ───────────────────────────────────────────
  #   steer = alpha×이전 + (1-alpha)×새 값.  0=필터 없음, 클수록 무겁고 느리다.
  #
  #   ★★ 이 값은 **루프 주기에 걸려 있다.** 시정수 = -Δt/ln(alpha) 다.
  #        실차 map_controller : create_timer(0.02) → 50Hz
  #        시뮬 map_controller : /ego_racecar/odom 콜백 → 250Hz
  #      같은 0.8892 가 실차에서는 170ms, 시뮬에서는 34ms 다 — **5배**.
  #      시뮬 옵티마이저가 34ms 짜리 필터로 고른 값을 실차에 옮기면 그만큼
  #      위상이 늦어진다. 2026-08-09 고속 요 진동의 지연원 중 가장 큰 항이었다
  #      (헤딩오차→조향 상호상관으로 잰 전체 루프 지연 290ms 중 170ms).
  #      → 시뮬과 같은 34ms 가 되도록 0.555 로 내렸다.
  #      ※ 옵티마이저가 이 값을 다시 찾으면 **주기 차이를 반드시 환산할 것.**
  #        alpha_실차 = exp(-0.02/τ),  τ = -0.004/ln(alpha_시뮬)
  #   조향이 거칠면 0.6~0.7 로 조금 올린다 (그만큼 지연이 늘어난다).
  steer_alpha: 0.555

  # ── 슬립보정 이득 ───────────────────────────────────────
  #   조향 = 기구학항 δ_kin + Pacejka 슬립보정 α_f. 이 값은 α_f 에만 곱한다.
  #
  #   ★ 2026-08-09 실차(cool_clean, η=0.7): 직선 떨림은 잡혔는데 코너에서
  #     **안쪽으로 파고들었다.** 주행 궤적 곡률을 기준 곡률과 직접 비교:
  #        s=20m  κ 0.53 → 실제 1.01  (1.89배)
  #        s=24m  κ 0.77 → 실제 0.96  (1.24배)
  #        s=28m  κ 0.68 → 실제 0.82  (1.20배)
  #     타이어가 모델만큼 안 미끄러진다는 뜻이다. 정상선회 기준 α_f 를 계산해보면
  #        κ0.77 v1.99㎧ : δ_kin 14.3° + α_f 11.5° = 25.7°  (좌 한계 20.7° 초과)
  #        κ0.53 v2.81㎧ : δ_kin  9.9° + α_f 16.6° = 26.6°  (초과)
  #     α_f 가 기구학항만큼 크다. mu(0.348)나 pac_b(3.8)가 실제보다 낮게 잡혀
  #     있다는 뜻인데 둘 다 [미검증] 값이다.
  #
  #   ★ 왜 mu 를 올리지 않고 이 손잡이를 쓰나: mu 는 속도 프로파일도 같이
  #     바꾼다(더 빨라진다). 조향 문제를 고치려다 속도까지 움직이면 다음 주행에서
  #     뭐가 효과였는지 못 가린다. 원인이 확정되면 mu/pac_b 로 옮길 것.
  slip_gain: 0.5            # 1.0 = 모델값 그대로. 코너에서 파고들면 낮춘다

  # ── 속도 프로파일 ───────────────────────────────────────
  #  ★ grip_util / a_lon_acc / a_lon_brk 는 **[limits] 절로 옮겼다** (2026-08-09).
  #    map 뿐 아니라 stanley·gap_follower 도 같은 값을 쓰기 때문이다.
  #    여기에 적어도 **아무 효과가 없다** — launch 는 limits 만 읽는다.
  #    ↑ 위 "4-1. 물리 한계" 절을 볼 것.
  #
  #  아래 μ / pac_* / mass / lf / lr 는 **차량 물리**라서 여기 남는다.
  #  (컨트롤러가 아니라 차의 성질이다. 세 컨트롤러가 이 값을 공유한다)

  # ── ↓ 실차에서는 폐기됐다. 그런데 지우면 안 된다 ─────────────────
  #   실차 map_controller 는 이 둘을 **무시하고 기동 시 경고를 띄운다**
  #   (그 경고가 뜨는 게 정상이다). 속도는 [limits] 가 정한다.
  #   ★ 그래도 지우지 마라: 시뮬(sim_race.launch.py)이 아직 [map] 에서 읽고,
  #     키가 없으면 옛 기본값 speed_scale 2.0 / a_brake 6.0902 로 떨어진다.
  #     그 a_brake 는 이 노면 총 그립(3.14㎧²)의 1.9배라 물리적으로 불가능한
  #     감속선이다. 시뮬 쪽을 먼저 정리한 뒤에 지울 것.
  speed_scale: 0.7092
  a_brake: 3.7074

  # ── 타이어 / 차량 동역학 ────────────────────────────────
  #   ★ mass 와 lr 은 **조향** 계산에서 대수적으로 약분된다
  #     (F_yf/(mu·Fzf) = a_lat/(mu·g)). 조향만 보면 mu 하나가 좌우한다.
  #     ※ 하지만 lf / lr 은 **속도 프로파일**에서는 약분되지 않는다 —
  #       후륜구동 가속 한계가 a_g·lf/L 이라 하중분율이 그대로 들어간다.
  #       "어차피 안 쓰는 값"이 아니다. 실측값을 넣을 것.
  #   mu 를 낮추면 = "접지가 나쁘다" 고 보고 같은 코너에서 조향을 더 준다.
  # ★ mu 추정 0.40 (화강석 타일 + 먼지, 2026-08-09):
  #   ① μ_k = v·ω/g 99%p 0.487 → 휠 스핀 보정 0.40
  #   ② 기하학 — 조향 20.7°(기구학 반경 0.85m)인데 실제 3.0m 로 밀림
  #   ③ 곡률 실측 A_LAT_MAX 3.7㎧² → 오도메트리 보정 후 0.45g
  #   ※ 아직 추정값 (0.40 ± 0.08). 정반경 주행으로 재확정 필요.
  #   ※ 대회 노면(우레탄)은 다르다 — 현장에서 다시 잴 것.
  # mass/lf/lr 실측 (2026-08-09): 3354g, 앞1510g/뒤1840g, L=0.32m
  #
  # ★★ mu 는 마찰계수가 **아니다**. 이 파라미터화에서 차가 실제로 낼 수 있는
  #   최대 횡가속(= 우리가 측정하는 값)은 **mu × pac_d** 다.
  #   MAP 논문 III-B: "the peak value D̃ is in fact μ·Fz,i·Di".
  #   대조: 논문값 1.0489 × 1.2084 = 1.267g — 논문 본문 "1.25 g" 와 일치한다.
  #
  #   ▶ 불변식:  mu × pac_d = 0.40   (실측 실효 그립 [g])
  #     0.348 × 1.15 = 0.40 ✔   pac_d 를 바꾸면 mu 도 반드시 같이 바꿀 것.
  #
  #   ※ gen_raceline 의 --mu 는 규약이 달라(a_lat_max = mu·g) 0.40 을 쓴다.
  #     sim_vehicle.mu(f1tenth_gym)도 같은 규약이라 0.40 이다.
  #     세 값이 달라 보이는 건 정상이다.
  mu:   0.348               # 실효 0.40g = 0.348 × pac_d(1.15)
  mass: 3.354
  lf:   0.1757
  lr:   0.1441

  # ── Pacejka Magic Formula 계수 ──────────────────────────
  #   Fy = D·sin(C·atan(B·α − E·(B·α − atan(B·α))))
  #   우리 차 추정 (2026-08-09): F1TENTH 폼 타이어 기반
  #   B 소폭 상향(경량→접지압 낮음), D 소폭 하향(불확실성 반영)
  pac_b:  3.8
  pac_c:  1.3
  pac_d:  1.15
  pac_e: -0.5

  # ── 기타 ────────────────────────────────────────────────
  reverse_check: true       # 첫 pose 때 웨이포인트 진행방향이 차 헤딩과 반대면
                            #   배열을 뒤집는다. 역주행 웨이포인트 방지용

# ------------------------------------------------------------
# Stanley 컨트롤러 파라미터 (controller: stanley 일 때 사용)
#
#   Q1 모드: Stanley 조향 + 속도 프로파일([limits]), 장애물 감지 없음
#   Q2 모드: Q1 + LiDAR 장애물 감지 → 목표점을 옆으로 시프트하여 우회
#            (시프트량 = car_width + obstacle_margin = 0.42m, 아래 참조)
#   Q3 모드: Q1과 동일, grip_util 을 높여 공격적으로
#
#   웨이포인트 CSV: x, y, speed  (m, m, m/s) — 헤더 없이 행당 1포인트
#   경계 파일 (Q2): maps/<map_name>/inner_bound.npy
#                   maps/<map_name>/outer_bound.npy
#                   (픽셀 좌표 int32, draw_waypoints.py로 생성)
# ------------------------------------------------------------
stanley:
  # ── 조향 ─────────────────────────────────────────────────
  #  비틀거림(지그재그) = 게인 과다. 흔들리면 gain↓ k↓ ks↑ 방향으로.
  #  (gain 2.0 / k 2.0 / ks 0.5 조합에서 저속 헌팅 확인 — 2026-07-16)
  gain: 1.6                 # Stanley 전체 게인 (클수록 반응 빠름)
  k: 1.8                    # 횡방향 오차(CTE) 비례 게인
  ks: 1.5                   # 저속 안정화 상수 (클수록 저속 조향 완만)

  # ── 곡률 피드포워드 + 조향 필터 ──────────────────────────
  #  피드포워드 = 경로 곡률로 코너의 "정답 조향각"을 미리 적용.
  #  Stanley 피드백은 잔차만 보정 → 코너를 늦게 꺾는 문제 해소.
  ff_gain: 1.2              # 0 = 끔. 코너에서 안쪽 파고들면↓ 0.9 정도, 바깥으로 밀리면↑ 1.1정도 절대 0으로 두지 말 것
  ff_preview_sec: 0.38      # 서보 지연 보상 예견 시간 (s)
  steer_lpf: 1.0            # 조향 저역통과 (1.0=끔, 0.6~0.8=고주파 떨림 완화)

  # ── 속도 ─────────────────────────────────────────────────
  # ↓ 폐기 — 컨트롤러가 경고하고 무시한다. 속도는 [limits].grip_util 이 정한다.
  #   (속도를 k 배 하면 요구 횡가속은 k² 배라 어느 코너가 한계인지까지 바뀐다)
  vel_scale: 1.0

  # ── Q2 장애물 회피 ────────────────────────────────────────
  obstacle_decel: 0.85      # 장애물 감지 시 속도 감소 비율 (0.85 = 15% 감속)
  # ★ 판정 기준은 "내가 실제로 지나갈 자리를 막았는가" 하나다.
  #   /odom yaw rate 로 선회 반경 R=v/w 를 얻어 진로를 원호로 예측하고,
  #   차폭만큼 부풀린 통로 안의 점만 장애물로 본다.
  #   레이싱라인은 우리가 임의로 넣은 계획일 뿐 충돌과 무관하다 — 라인 기준으로
  #   보면 추종 오차만큼 벌어진 구간에서 실제로 부딪힐 장애물을 놓친다.
  #   (라인은 "어디로 피할지"를 정하는 목표점에만 쓰인다)
  obs_corridor_half_width: 0.22
                            # 진로 통로 반폭 (m). 차 반폭 0.17 + 여유
  obs_release_scale: 1.6    # 회피 중에는 통로를 이 배로 넓혀 본다 (해제 조건 완화).
                            #   좁은 통로만 보면 회피 조향을 시작하는 순간 장애물이
                            #   통로 밖으로 나가 감지가 풀리고, 라인으로 복귀하다
                            #   다시 감지되는 진동이 생긴다. 1.0 = 히스테리시스 없음
  # ★ 회피량은 "장애물 폭 = 내 차 폭" 으로 가정해 계산한다.
  #   1:1 레이싱에서 장애물은 곧 상대 차량이다. 작은 콘에도 같은 기준을 쓰면
  #   넉넉하게 비껴가므로 안전하다.
  #     목표점 이동량 = car_width + obstacle_margin
  #     (중심간 필요 간격 = 내 반폭 + 상대 반폭 = car_width, 거기에 여유)
  car_width: 0.30           # 내 차 폭 (m)
  obstacle_margin: 0.12     # 스치지 않을 여유 (m)  → 이동량 0.42m
  obstacle_shift_rate: 0.9  # ★ 기준선을 옮기는 속도 (m/s)
                            #   계단으로 0.42m 옮기면 CTE 가 그만큼 튀어
                            #   조향이 좌 한계(20.73도)로 포화된다. 해제 때는
                            #   반대 방향으로 같은 킥 → 좌우 휘청임의 원인.
                            #   0.9 m/s 면 0.42m 이동에 0.47초. 낮추면 더 부드럽고
                            #   느리게, 높이면 빠르지만 킥이 커진다
  # 전방 감시 거리 — 이 구간을 막은 장애물만 회피 대상.
  #   horizon = clip(min + sec × 속도, min, max)   → 아래 값이면 2.5㎧ 에서 2.3m
  #   회피에 필요한 거리는 속도에 비례한다. 고정값으로 크게 잡으면 아직 한참
  #   남은 장애물에 미리 반응해 라인을 벗어난다.
  #   ★ Stanley 는 전방주시 지연이 없어 MAP 보다 짧아도 된다. MAP 은 아래
  #     frenet.per_controller.map 에서 따로(2.9~5.0m) 준다.
  obs_horizon_sec: 0.6      # 몇 초 앞까지 볼 것인가
  obs_horizon_min: 0.8      # 저속에서도 최소 이만큼 (0 이면 아무것도 못 봄)
  obs_horizon_max: 3.0      # 상한 (고속에서 과하게 멀리 보지 않도록)
  obs_vote_frames: 7        # 차단 판정 투표 창(프레임). 과반이 차단이면 회피.
                            #   ★ 08/05: 3 → 7. 벽이 간헐적으로 잡혀 시프트가
                            #   켜졌다 꺼지며 사인파 진동(진폭 66cm)이 생겼다.
                            #   창을 넓히면 단발 오검출이 과반을 못 넘긴다.
                            #   라이다 40Hz → 5프레임 = 125ms = 1.8m/s 에서 0.23m
                            #   키우면 오탐에 둔감해지지만 반응이 느려진다

  # ── Adaptive Lookahead: L = (max-min)/gain * speed + min ─
  lookahead_min: 0.5        # 정지 시 전방주시거리 (m)
  lookahead_max: 2.5        # 최고속 시 전방주시거리 (m)
  lookahead_gain: 7.0       # 속도→거리 변환 게인 (클수록 속도에 덜 민감)
  interp_scale: 20          # 목표점 보간 분해능

  # ── Q2 경계 파일 위치 ─────────────────────────────────────
  # 비워두면  maps/<map_name>/  에서 자동 탐색
  # 벽 반사를 '벽' 으로 걸러낼 여유 (m). raycast_obs: false 일 때만 쓰인다.
  track_margin: 0.28

  bound_dir: ''

  # ── 장애물 판정: 빔별 기대거리 비교 (레이캐스팅) ───────────
  # 맵 벽을 pose_unc 만큼 부풀려 레이캐스팅한 "가능한 가장 짧은 기대거리" 보다
  # deficit 이상 짧게 끊긴 빔만 장애물로 본다. 상세: 개발현황.md 08/05
  raycast_obs: true
  raycast_pose_unc: 0.25    # 위치추정 불확실성 (m). 키우면 벽 오검출 ↓, 벽 근처 장애물 놓침 ↑
  raycast_deficit: 0.30     # 기대보다 이만큼 짧아야 장애물 (m)

  # ★ 검사 (B) — 2026-08-11 신설. 빔 끝점이 맵 벽에서 이만큼 떨어져 있으면
  #   장애물로 본다 (0 = 끔). 위 deficit 검사와 **합집합**이다.
  #
  #   왜 필요한가 — 08/09 q2 bag 6개를 재생해 실측했다. 가려진 장애물(벽 뒤)을
  #   제외한 진짜 검출률:
  #
  #       거리         0.3~1m   1~2m   2~3m   3~4m   4~5m
  #       deficit 만     32%    25%    14%    17%     2%
  #       + free_gap     37%    46%    41%    35%    21%
  #
  #   호라이즌은 2.9~5.0m 로 맞춰 뒀는데 **검출기가 그 거리에서 안 잡고 있었다.**
  #   감지했을 땐 이미 1m 앞이고 MAP 은 오프셋을 옮기는 데 2.2~3.7m 를 달려야
  #   한다 — 구조적으로 못 피한다. 08/09 "q2 세 번 모두 실패" 의 나머지 절반이다.
  #
  #   deficit 검사는 "기대보다 얼마나 짧은가" 라 **기대거리가 짧은 좁은 통로에서
  #   무력해진다.** 이 검사는 "그 점이 벽에서 얼마나 떨어졌나" 라 통로 폭과
  #   무관하고, 벽 반사는 정의상 벽 근처에 찍히므로 오검출이 늘지 않는다.
  #
  #   대안으로 raycast_pose_unc 를 0.25→0.12 로 낮춰도 비슷한 재현율이 나오지만
  #   그건 **벽을 장애물로 만드는 방향**이다 (2026-08-05 직선 9.4m 를 42cm 밀려
  #   달린 그 실패). AMCL 종방향 오차가 실측 10~20cm 라 0.12 는 못 쓴다.
  #   이 검사는 pose_unc 를 건드리지 않는다.
  #
  #   0.30 이 무릎점이다 (0.25 로 더 낮춰도 이득 없음). 트랙 반폭이 0.5~0.6m 라
  #   한가운데 장애물은 0.30 을 넘고, AMCL 오차 0.2m 를 빼도 여유가 남는다.
  raycast_free_gap: 0.30
  raycast_fov_deg: 100.0    # 전방 감시 화각 (±deg)
  raycast_beam_deg: 1.0     # 빔 샘플 간격 (deg)

# ------------------------------------------------------------
# Gap Follower / Disparity Extender 파라미터 (q2 / race)
# ------------------------------------------------------------
gap_follower:
  car_width: 0.40           # 안전마진 포함 차폭 (m)
  disparity_threshold: 0.4  # 불연속 판정 거리차 (m)
  max_range: 8.0            # LiDAR 클리핑 거리 (m)
  fov_deg: 180.0            # 전방 시야각 (도) - 이 밖의 스캔 무시
  steer_gain: 0.8           # 조향 게인
  speed_gain: 0.5           # 전방거리 비례 속도 게인 (v = min(max, gain*front_dist))
                            #   ★ 최종 속도는 조향각이 곧 곡률(κ=|tanδ|/L)이라는
                            #     물리로 다시 제한된다: v ≤ √(η·μ_eff·g/κ).
                            #     레이싱라인이 없는 컨트롤러의 [limits] 반영 경로다.

# ------------------------------------------------------------
# Pure Pursuit 파라미터 (q1 / q3)
# ------------------------------------------------------------
pure_pursuit:
  lookahead: 1.8            # 전방주시거리 (m). 고속=크게, 저속=작게
  lookahead_speed_gain: 0.3 # 속도 비례 lookahead 가변 (L = lookahead + gain*v)
  wheelbase: 0.33           # 축간거리 (m)
  max_steer: 0.36           # 최대 조향각 (rad)
  curvature_slowdown: 1.5   # 곡률 기반 감속 게인 (클수록 코너에서 많이 감속)

  # ★ Q2 장애물 회피 — Stanley 의 wall_avoid.enabled 처럼 이 값 하나로 껐다/켠다.
  #   켜면 Stanley 의 Q2 로직(트랙 경계 마스크 + 예측 통로 판정 + 목표점 좌우
  #   시프트)을 그대로 따른다. 회피의 기하 파라미터(차폭/여유/통로폭 등)는
  #   아래 [stanley] 섹션 값을 그대로 재사용한다 — 같은 트랙·같은 차이므로
  #   튜닝을 두 군데서 따로 관리하지 않는다.
  #   false = 기존과 동일하게 장애물 무시하고 레이싱라인만 추종.
  obstacle_avoid_enabled: false


# ========================================================================
#  4. 장애물 회피
# ========================================================================

# ------------------------------------------------------------
# Frenet 후보 궤적 회피 (map / Stanley 의 Q2·race)
#   레이싱라인을 기준선으로 횡오프셋 후보를 깔고 비용 최소를 고른다.
#   비용 = w_offset·|d| + w_change·|d-현재| - w_clear·min(여유, clear_cap)
#   RViz: /frenet_candidates (초록=선택, 파랑=가능, 빨강=불가)
#   상세: 개발현황.md 08/04
# ------------------------------------------------------------
frenet:
  # ★ 2026-08-06 true 로 켬 — 옛 방식(래치 + 고정량 0.42m)이 Q2 두 번째 장애물에서
  #   좁은 구간으로 조향해 벽에 충돌했다. 옛 방식은 시프트 **방향을 장애물 반대편**
  #   으로만 정하고 그쪽에 트랙이 남았는지는 보지 않으며, 양도 0.42m 고정이다.
  #   half_clean 실측: 라인→벽 여유 최소 0.350m (차 반폭 0.17 빼면 0.180m).
  #   0.42m 시프트가 물리적으로 불가능한 지점이 400점 중 69점(17%)이었다.
  #   Frenet 은 bounds 로 트랙 밖 후보를 애초에 배제하므로 이 구간에선 작은
  #   오프셋이나 0 을 고르고 감속(obstacle_decel)으로 처리한다.
  enabled: true              # false = 옛 방식(래치 + 고정량 0.42m)
  candidates: 17            # 후보 개수 (홀수여야 d=0 포함). 많을수록 잘게 고른다
  d_max: 0.65               # 최대 횡오프셋 (m)
                            #   장애물 폭 = 차폭(0.34)×1.5 = 0.51m 기준.
                            #   라인 정중앙이면 0.255 + clearance 0.36 = 0.615m 필요
                            #   ★ 이건 **천장일 뿐**이다. 회피량을 정하는 건 아래
                            #     clearance 다 — 이유는 그쪽 주석 참고.
                            #     2026-08-13 map_0813 실측: 라인→벽 중앙 0.814m 라
                            #     d 0.60 도 트랙의 50% 에서 이미 도달 불가능하다.
                            #     올려도 넓은 구간에서만 쓰인다(거기선 0.92m 까지 가능).
  clearance: 0.36           # 후보가 확보해야 할 장애물까지 최소 거리 (m)
                            #   ★ obs_corridor_half_width 이상이어야 한다
                            #
                            #   ★★ **이 값이 회피량을 정한다.** d_max 도 clear_cap 도
                            #     아니다. 비용을 |d| 로 미분하면
                            #        ∂비용/∂|d| = w_offset − w_clear·∂room/∂|d|
                            #     인데 후보를 δ 밀면 장애물 거리는 최대 δ 늘어나므로
                            #     ∂room/∂|d| ≤ 1 → 기울기 ≥ 1.0−0.5 = +0.5 로 **항상 양수**다.
                            #     즉 플래너는 언제나 "실행가능한 것 중 가장 작은 d" 를
                            #     고르고, 그 경계가 곧 clearance 다. 더 피하고 싶으면
                            #     여기를 올리는 것 말고는 방법이 없다.
                            #
                            #   2026-08-13: 0.30 → 0.36 (차 끝~장애물 간격 0.13→0.19m).
                            #     ⚠ 좁은 구간에서는 실행가능 후보가 사라져 status=2 로
                            #       떨어지고 argmax(room) + obstacle_decel 로 처리된다.
                            #       map_0813 기준 "필요 d 를 못 내는 지점" 37% → 52%.
                            #       0.40 이상은 권하지 않는다 — 68% 가 되면 회피가
                            #       아니라 감속이 기본 동작이 된다.
  w_offset: 1.0             # |d| 비용 — 라인 복귀력
  w_change: 1.0             # |d-현재| 비용 — 히스테리시스
  w_clear: 0.5              # 여유거리 보상. ★ w_offset 보다 작아야 한다
                            #   크면 "옆으로 갈수록 이득"이 되어 최대까지 벗어난다
  clear_cap: 0.35           # 이 이상 여유는 더 안 쳐준다 (m)
  bounds: true              # 벽까지 거리를 후보 평가에 넣는다 (false = 장애물만 봄)

  # ★★ 통과 여유 하한 [m] — 2026-08-11 신설. 이 절에서 가장 중요한 값이다.
  #
  #   그 전 판정은 "후보 경로의 **모든** 점이 벽에서 track_margin(0.28m) 밖인가"
  #   라는 예/아니오였다. 호라이즌이 2.9~5.0m 라 그 창 전체가 0.28m 밖이어야
  #   하는데, cool_clean 은 레이싱라인 점의 0.7% 가 그보다 벽에 가깝다.
  #   5m 창에 all() 을 걸면 그 0.7% 가 **27% 프레임 탈락**으로 증폭된다.
  #   → 17개 후보 중 중앙 5개만 살아남고, 전부 살아남는 프레임은 0% 였다.
  #
  #   결과가 08/09 로그에 그대로 있었다 — **장애물이 없을 때 더 많이 움직였다**:
  #       q1(장애물 없음)  |d| 중앙 0.075m  p90 0.375m  |d|>0.1 이 31%
  #       q2(장애물 있음)  |d| 중앙 0.075m  p90 0.225m           17%
  #   "q2 회피가 안 된다" 의 절반은 회피 로직이 아니라 이 판정이었다.
  #
  #   이제 예/아니오 대신 **통과 여유**를 잰다:
  #       room = min(벽까지 거리, 장애물까지 거리) 를 경로 전체에서 최소
  #   실행가능 = room ≥ min_room. 0.22 = 차 반폭 0.17 + 여유 0.05.
  #   실측 라인→벽 최소거리는 cool_clean 0.280m / fun_clean 0.360m 이라
  #   0.22 에서 **두 트랙 모두 라인 탈락 0%** 다.
  #     ※ 올리면 회피 여지가 줄고, 내리면 벽에 가까이 붙는다. 0.22 가 하한이다
  #       (차 반폭 0.17 자체를 못 내려가므로).
  min_room: 0.22

  # 반대쪽 통로가 이만큼 더 넓어야 갈아탄다 [m]. 좌우 진동 방지.
  #   ★ 없으면 장애물 정면에서 좌우가 프레임마다 뒤집혀 조향이 떤다.
  #     "지금 쓰는 쪽" 을 기본으로 두고, 반대쪽이 확실히 넓을 때만 옮긴다.
  gap_hyst: 0.10

  debug: true               # /frenet_candidates 마커

  # ── 컨트롤러별 오버라이드 ────────────────────────────────────
  #   ★ 회피 호라이즌은 컨트롤러마다 달라야 한다. 오프셋 d 에 수렴하는 속도가
  #     다르기 때문이다:
  #
  #       Stanley  δ = ψ_e + atan(k·e/v)   전방주시 지연 없음 → 즉시 반응
  #       MAP/L1   a_lat = 2v²sin(η)/L1    2차계(ζ=0.707, ωn=√2·v/L1)
  #                → 오버슈트는 4.3% 로 작지만 **상승거리 1.8·L1/√2** 를 달려야
  #                  오프셋을 다 옮긴다. L1 = max(l1_min, l1_k·v) 라 속도에 비례해
  #                  길어진다:  3㎧ → 2.23m,  5㎧ → 3.71m
  #
  #     여기에 아래 shift_rate 램프 거리까지 더한 것이 실제 필요 거리다.
  #     ★ 2026-08-09 실차에서 q2 세 번 모두 못 피한 원인이 이것이었다 —
  #       호라이즌이 l1_min=0.90 시절의 1.8m 인데 obs_horizon_max 3.0m 에도
  #       걸려 있어서, 4㎧ 에서 필요한 5.6m 의 절반뿐이었다.
  #       **감지한 순간 이미 늦는다.**
  #
  #     경험칙: 호라이즌 ≥ 2 × L1. 적지 않으면 launch 가 2×l1_min 으로 잡는다.
  #     l1_min 을 줄여 수렴을 빠르게 하는 건 권하지 않는다 — 조향 이득이 폭증해
  #     진동한다(위 [map] 절 주석 참고). 호라이즌을 늘리는 쪽이 안전하다.
  #     ※ l1_min 을 바꾸면 아래 obs_horizon_min 도 같이 볼 것.
  per_controller:
    map:
      # 2026-08-13: 고속에서 여유가 30㎝ 밖에 없어 전부 늘렸다.
      #   필요 거리 = L1 상승거리 1.273·L1  +  기준선 램프 (d_max/shift_rate)·v
      #             ≈ 1.273·0.75v + 0.325v  =  1.28·v      (l1_k 가 지배하는 영역)
      #   구 설정 clip(2.9+0.7v, 2.9, 5.0) 은 3.9㎧ 에서 필요 4.99m / 확보 5.00m —
      #   여유 0.01m 였다. 3.6㎧ 를 넘으면 "감지한 순간 이미 늦는" 상태가 된다.
      #   신 설정 clip(2.6+1.0v, 2.6, 6.0):  3.0㎧ → 5.6/필요 3.84,
      #                                      3.9㎧ → 6.0/필요 4.99  (여유 1.0m)
      #
      # ⚠ 공짜가 아니다. room 은 **경로 전체의 최소값**이라 창이 길어질수록
      #   좁은 지점 하나가 들어올 확률이 올라가 후보가 더 많이 탈락한다 =
      #   회피량이 오히려 줄 수 있다. map_0813 실측 (0.3m 이상 밀 수 있는 위치 비율):
      #       창 3m 80.0%   4m 77.0%   5m 74.0%   6m 71.0%   7m 68.2%
      #   5→6m 의 대가는 3%p 라 감수할 만하지만, 7m 이상은 권하지 않는다.
      obs_horizon_min: 2.6    # ≈ 2 × l1_min. car2 는 1.20(→2.4), car1 은 1.3155(→2.63)
                              #   ★ 두 차 공용 파일이라 **큰 쪽**에 맞췄다
      obs_horizon_sec: 1.0    # 위 필요식 1.28·v 를 여유 있게 덮는다
      obs_horizon_max: 6.0    # 통로는 레이싱라인을 따라 뻗으므로(_predicted_track_path)
                              # 늘려도 코너 벽을 긁지 않는다

  # ── 컨트롤러가 오프셋을 받는 쪽 (frenet_planner → 컨트롤러) ──
  #    켜고 끄는 건 위의 enabled 하나다. 여기 또 쓰면 YAML 중복 키가 되어
  #    뒤엣것이 조용히 이긴다 (2026-08-09 제거).
  timeout:    0.5           # s. 이만큼 /frenet/offset 이 끊기면 d=0 으로 복귀
  shift_rate: 2.0           # m/s. 기준선을 옮기는 속도 (계단이면 조향 킥이 난다)
                            #   0.6m 오프셋에 0.3s — 4㎧ 면 1.2m 를 쓴다.
                            #   ★ 낮추면 그만큼 호라이즌이 더 필요하다. 옛 0.9 는
                            #     0.67s = 2.7m 를 흘려보내 회피 실패의 한 축이었다.

# ------------------------------------------------------------
# 벽 스침 회피 (wall avoidance) — Stanley 전용
#
#   "2시 방향에서 벽이 다가와 우측 전면이 스칠 것 같다" 같은 상황에서
#   살짝 반대쪽으로 조향해 비껴간다. AEB(정지)로는 못 막는 영역이다.
#
#   판정은 "가장 가까운 점"이 아니라 **침범량**이다:
#     원하는 여유 = half_width + clearance
#     그 안으로 들어온 만큼(m) × gain → 보정 조향(rad), max_steer 로 제한
#   나란한 벽은 여유 밖이면 침범량 0 → 아무 보정도 안 나온다.
#   양쪽이 동시에 좁아지면 상쇄돼 가운데를 유지한다(그건 AEB 담당).
#
#   ★ Stanley 의 CTE 항이 이 보정에 저항해서 자기제한이 걸린다.
#     0.1rad 보정 ≈ 12cm 횡변위에서 평형. 그래서 라인을 영구히 벗어나지 않는다.
#   ※ 임계값이 트랙 폭과 겹치면 리밋 사이클이 된다 (상세: 개발현황.md 08/04).
#     이 트랙은 라인 위 벽 여유가 최소 0.06m 라 특히 좁다.
#   ※ 실차 검증 전이므로 기본값 false. 켤 때는 반드시 낮은 속도부터.
# ------------------------------------------------------------
wall_avoid:
  enabled: false
  half_width: 0.17          # 차폭의 절반 (m)
  clearance: 0.08           # 추가 여유 (m) → 합 0.25m 안에 들어와야 발동
  lookahead: 1.2            # 전방 감시 거리 (m)
  gain: 0.3                 # 침범량(m) → 보정 조향(rad)
  max_steer: 0.06           # 보정 조향 상한 (rad)
  lpf: 0.25                 # 보정 조향 저역통과
  min_range: 0.12           # 이보다 가까운 반사는 차체 자체로 보고 무시 (m)


# ========================================================================
#  5. 위치추정 · 미션 · 안전
# ========================================================================

# ------------------------------------------------------------
# 로컬라이제이션 (AMCL)
# ------------------------------------------------------------
localization:
  # ★ 2026-08-13 (2호차) map_0813_clean 기준. 1호차 fun_clean 값은 (0.0005, -0.0684, 0.0968)
  #   이었다 — 트랙 설정은 아직 차량별로 안 나뉘어 있으니 상대 차가 쓸 때 되돌릴 것.
  init_x: 11.7669       # 시작 위치 초기 추정 (map 좌표)
  init_y: -1.236
  #   ⚠ yaw 는 아직 옛 값이다. 위치만 맞고 방향이 틀리면 AMCL 이 수렴을 못 하거나
  #     엉뚱한 곳으로 붙는다. ./race.sh box 로 띄우고 RViz 2D Pose Estimate 로
  #     맞춘 뒤 ./race.sh savepose 하면 x·y·yaw 가 한 번에 저장된다.
  init_yaw: -0.009       # 라디안

  # ── IMU yaw 융합 — odom 의 각속도를 VESC 자이로 실측으로 교체 ──
  #    상세: 개발현황.md 08/03
  imu_yaw: true             # false = 기존 odom 그대로 중계 (롤백)
  imu_topic: /sensors/imu/raw
  imu_gyro_units: deg       # VESC 는 deg/s
  imu_yaw_axis: z           # 실측: 전방=IMU -y, 좌측=+x, 위=+z (z축 90° 회전)
  imu_yaw_sign: 1.0
  imu_bias_warmup_sec: 3.0  # 기동 후 이만큼 정지하면 자이로 바이어스 확정
  imu_bias_alpha: 0.002     # 이후 정지 때마다 갱신 (지수평균)
  imu_stationary_speed: 0.05      # 정지 판정: 속도 (m/s)
  imu_stationary_rate_deg: 2.0    #  + 자이로 (deg/s). 둘 다 만족해야 함

  # ── 초기 위치 자동 정렬 — RViz 2D Pose Estimate 대신 ──────────
  #    상세: 개발현황.md 08/04
  auto_localize: true
  align_use_walls: true      # 복도 벽 방향으로 yaw 를 먼저 맞춘 뒤 위치 탐색
  align_search_xy: 0.5       # init_pose 기준 ± 탐색 범위 (m)
  align_search_yaw_deg: 15.0 # ± 탐색 각도 (도). 벽 정렬이 되면 이 값은 보조용
  align_step_xy: 0.05        # 격자 간격 (m)
  align_step_yaw_deg: 1.0    # 격자 각도 (도)
  align_fit_warn: 0.20       # 평균오차가 이보다 크면 경고 (m)

  # ── AMCL 보정 슬루 제한 ───────────────────────────────────────
  #   AMCL 이 새 위치를 내면 컨트롤러는 map←odom 보정을 갱신한다. 예전에는
  #   **즉시 전부** 반영했다 — AMCL 이 튀면 다음 50Hz 틱에서 조향이 그만큼 튄다.
  #
  #   ★ 2026-08-09 실차: q2 로 장애물을 치고 다니며 트랙 구조물이 실제로 움직였다.
  #     맵-스캔 잔차가 평균 4.1 → 8.2cm, 최대 15 → 39cm 로 두 배가 됐다.
  #     그 상태로 q1 을 6㎧ 로 돌리자 AMCL 이 s=17.6m 에서 2.90m,
  #     s=18.6m 에서 **4.50m** 점프했다 (yaw 52.9°). 이탈 지점과 정확히 일치.
  #     같은 η=1.0 이라도 트랙을 건드리기 전 주행은 3랩 완주했다 (CTE p95 0.32m).
  #
  #   위치추정이 잠깐 틀린 채 가는 것보다 조향이 튀어 벽으로 가는 게 훨씬 나쁘다.
  #   거부가 아니라 **속도 제한**이라 AMCL 이 옳으면 몇 초 안에 수렴한다.
  #   출발 전(/race/enabled=false)에는 제한하지 않는다 — 초기 정렬을 막으면 안 된다.
  #   제한이 걸리면 경고가 뜬다. 자주 뜨면 맵을 다시 만들 때다.
  #
  #   ★ 값은 bag 에서 **보정 변화율 분포를 재서** 정했다. AMCL 은 평상시에도
  #     파티클 잡음으로 보정을 계속 흔든다 — 정상 주행에서 중앙 0.75㎧,
  #     p90 2.06, p99 3.63㎧ 였다. 여기를 자르면 위치추정을 망가뜨린다.
  #     반면 문제의 점프는 254㎧ / 2994°/s 로 두 자릿수 이상 떨어져 있다.
  #
  #       한계        정상주행에서 제한 걸리는 비율   4.5m 점프 수렴
  #       1.0㎧/45°          38.5%   ← 못 쓴다           4.50s
  #       2.0㎧/60°          11.7%                       2.25s
  #       4.0㎧/120°          0.8%   ← 선택              1.12s
  #       8.0㎧/200°          0.0%   ← 너무 느슨          0.56s
  pose_corr_rate:     4.0    # m/s.   0 = 끔(옛 동작)
  pose_corr_yaw_rate: 2.1    # rad/s (=120°/s)

  # ── 컨트롤러·AEB 가 볼 오도메트리 ─────────────────────────────
  odom_topic: /odom_imu      # 되돌리려면 /odom

  # ── 위치추정 품질 감시 (읽기 전용, 주행 영향 없음) ──────────
  #   매 스캔마다 맵 레이캐스팅 기대거리 vs 라이다 실측의 잔차를 잰다.
  #   [loc] 잔차 = 위치추정 오차,  [scale] 기울기 = 맵 스케일 오류 판정
  monitor: true
  monitor_beam_deg: 2.0     # 빔 샘플 간격 (deg). 촘촘할수록 정확·느림
  monitor_max_range: 6.0    # 이 거리 안의 빔만 사용 (멀면 입사각이 누움)
  monitor_reject_m: 1.0     # 이보다 큰 잔차는 맵에 없는 물체로 보고 제외
  monitor_cell: 0.4         # 잔차 공간분포 격자(m) — 어느 벽이 맵과 다른지 찾는 용도
  monitor_map_sec: 20.0     # [map] 공간분포 보고 주기(s)

  # ── 스캔 모션 보정 (deskew) — 고속에서만 의미 있음 ────────────
  #    한 스캔(25ms) 동안 차가 움직이면 첫 빔과 마지막 빔이 다른 위치에서 찍힌
  #    것인데 메시지는 같은 순간처럼 담긴다. 상세: 개발현황.md 08/04
  scan_deskew: false       # 속도를 올릴 때 켤 것
  deskew_stamp_at: start     # header.stamp 기준 (start|mid|end). 틀리면 역효과
  deskew_min_yaw_rate: 0.05  # 이보다 느리게 돌면 보정 안 함 (rad/s)
  deskew_min_speed: 0.10     # 이보다 느리면 병진 보정 생략 (m/s)

# ------------------------------------------------------------
# 미션 매니저 (랩 카운트 / 자동 정지)
#    start line: 맵 좌표계 기준 출발선 통과 감지 반경
# ------------------------------------------------------------
mission:
  laps: 4                   # 이 바퀴수 완주하면 자동 정지 (0 = 무제한)
  time_limit_sec: 0         # 제한시간 초과 시 자동 정지 (0 = 무제한, q3는 120 권장)
  # ★ 2026-08-14 신설. true 면 출발선을 localization.init_x/init_y 에 **자동으로**
  #   맞춘다 (아래 start_x/start_y 는 무시된다).
  #   차를 세워둔 자리가 곧 출발선이라야 laps 가 딱 그 바퀴수가 된다. 어긋나면
  #   첫 랩만 부분 주행이라 실제로는 laps + (어긋난 만큼) 을 돈다 — 08-14 에
  #   출발선이 웨이포인트 71, 출발 지점이 185 라 3/4 바퀴를 더 돌게 돼 있었다.
  #   ./race.sh savepose 로 init 을 갱신하면 출발선도 같이 따라온다.
  #   ※ 대회 규정 출발선처럼 따로 둬야 하면 false 로 끄고 아래 값을 직접 적는다.
  start_at_init: true
  start_x: 2.0              # 출발선 x — start_at_init:false 일 때만 쓰인다
  start_y: -0.96            # 출발선 y
  start_radius: 1.5         # 출발선 통과 판정 반경 (m)

  # ── 출발 게이트 — 스택을 미리 띄우고 신호에 맞춰 출발 ────────
  #    트리거: 터미널 Enter / 조이스틱 버튼 / ./race.sh go
  #    대기 중 AMCL 이 수렴할 시간이 생긴다. 상세: 개발현황.md 08/04
  start_gate: true          # false = 기동 즉시 출발
  start_button: 1           # 조이스틱 출발 버튼 (F710: A=0 B=1 X=2 Y=3)
  start_key: true           # 터미널 Enter 허용

# ------------------------------------------------------------
# 안전장치 (AEB - 자동 비상 브레이크)
#
#   ★ 2026-07-21 방식 변경: "모든 빔의 TTC" → "주행 통로 안의 장애물"
#     예전(F1TENTH Lab2 표준)은 전방 ±88° 모든 빔에 TTC=range/(v·cosθ) 를 재고
#     최솟값으로 판정했다. 주행방향과 나란한 벽은 실제로는 멀어지지도 가까워지지도
#     않는데 이 식은 v·cosθ 로 접근한다고 가정해 오발동한다 (실제로 겪음).
#     지금은 /odom 의 yaw rate 로 주행 경로를 원호로 예측하고, 차폭만큼 부풀린
#     "통로" 안에 들어온 점만 본다. 나란한 벽은 통로 밖이라 애초에 제외된다.
#
#   발동 조건:  통로 안 장애물까지 호길이 < v²/(2·brake_decel) + v·ttc_threshold
# ------------------------------------------------------------
safety:
  enabled: False
  ttc_threshold: 0.15       # 반응시간(초). 정지거리 식의 v·t 항 — 클수록 일찍 제동
  hold_sec: 1.0             # 정지 유지 시간 후 재개

  corridor_half_width: 0.30 # ★ 통로 반폭(m). 차폭/2 + 여유. 오발동의 1차 조절 손잡이.
                            #   좁히면 벽·기둥에 덜 민감, 넓히면 더 안전(오발동↑)
  brake_decel: 3.0          # 제동 감속도(m/s²). 실측 전엔 보수적으로 낮게.
                            #   낮출수록 정지거리가 길어져 더 일찍 제동한다
  min_range: 0.12           # 이보다 가까운 반사는 차체 자체로 보고 무시(m)
  max_lookahead: 6.0        # 이보다 먼 점은 계산에서 제외(m)
  consec_frames: 3          # 연속 이만큼 검출돼야 발동 (단발 노이즈 제거)
  use_arc_corridor: true    # 곡선 통로. false 면 항상 직선 통로(디버깅용)
                            #   ※ 원호는 "지금 조향을 유지한다" 가정이라 급코너에서
                            #     바깥 벽이 통로에 들어올 수 있다. 코너 오발동이 나면
                            #     corridor_half_width 를 줄이거나 이걸 false 로.
  publish_debug: true       # /aeb_corridor 마커 발행 — RViz 로 범인 빔 확인


# ========================================================================
#  6. 시뮬레이터
# ========================================================================

# ------------------------------------------------------------
# 시뮬레이터 스폰 위치 (map 좌표계) — 시뮬 전용, 실차와 무관
#   ※ 첫 웨이포인트와 일치할 필요는 없다 (지금도 다르다. 현재 라인의 첫 점은
#     0.84, 3.66 / 진행방향 -2.87rad). 트랙 위 아무 데나 두면 된다.
# ------------------------------------------------------------
sim:
  sx:     2.45      # 첫 웨이포인트 x
  sy:     3.78      # 첫 웨이포인트 y
  stheta: 3.14159   # π = 진행 방향 (트랙에 맞게 조정)
  physics: bicycle  # gym | bicycle (Pacejka 자전거 모델, map: 파라미터 사용)

# ------------------------------------------------------------
# 시뮬레이터 차량 물리 파라미터 — 실차와 시뮬 동선 맞추기용
#
#   실차가 시뮬보다 코너에서 바깥으로 밀리면:
#     mu↓  (마찰 낮춤)  또는  sv_max↓  또는  steer_delay↑
#   실차가 시뮬보다 코너에서 안쪽으로 파고들면:
#     mu↑  또는  sv_max↑  또는  steer_delay↓
# ------------------------------------------------------------
sim_vehicle:
  mu:          0.40    # 마찰계수 — 화강석 타일 실측 2026-08-08
  C_Sf:        2.1     # 전륜 코너링 강성 (낮추면 전륜 언더스티어 강해짐)
  C_Sr:        5.4562  # 후륜 코너링 강성
  lf:          0.1757  # CoG→전륜 거리 (m) — 실측 하중분포 (2026-08-09)
  lr:          0.1441  # CoG→후륜 거리 (m) — 실측 하중분포 (2026-08-09)
  h:           0.074   # CoG 높이 (m)
  m:           3.74    # 차량 질량 (kg)
  I:           0.04712 # 관성 모멘트 (kg·m²)
  s_max:       0.36    # 최대 조향각 (rad) — max_steer와 동일하게
  sv_max:      1.2     # 최대 조향 각속도 (rad/s) — 낮을수록 코너 초입 선회 지연
  a_max:       9.51    # 최대 가속도 (m/s²)
  v_max:       10.0    # 최대 속도 (m/s)
  steer_delay: 14      # 조향 지연 스텝 수 (×10ms = 140ms 총 지연, 기본 2)
  tau_v:       0.40    # 속도 응답 시정수 (s) — 실측 406~440ms (2026-08-10 재측정)


# ========================================================================
#  7. 시각화 · 통신
# ========================================================================

# ------------------------------------------------------------
# 실시간 시각화 (RViz)  — 맵+레이싱라인+차 위치/궤적+LiDAR+목표점
#    주행 노드는 viz 값과 무관하게 시각화 토픽(/waypoints_path,
#    /car_path 등)을 항상 발행한다. RViz 뷰어만 노트북에서 켜면 됨.
#
#    ▶ 직접 SSH 로 젯슨에서 race.sh 를 돌리는 경우 (우리 방식):
#        노트북 로컬 터미널에서  ./rviz.sh  실행  ← 이게 뷰어
#        (viz 플래그는 이 경우 영향 없음)
#    ▶ 노트북에서 jetson.sh 로 원격 실행하는 경우에만:
#        viz: true 면 주행 시작 시 RViz 자동 기동
#    전제: 노트북에 rviz2 설치 + 젯슨과 같은 네트워크/ROS_DOMAIN_ID
# ------------------------------------------------------------
viz: true

# ------------------------------------------------------------
# 네트워크 / DDS  — 노트북에서 RViz 로 관찰할 때의 통신 설정
#
#   기본 FastDDS 는 WiFi 에서 /map(67KB) 과 /tf_static 같은
#   TRANSIENT_LOCAL(래치) 토픽을 늦게 붙은 구독자에게 전달하다가 자주 실패한다.
#   증상: ros2 topic list 에는 다 뜨는데 RViz 화면은 간헐적으로만 나옴.
#   → dds: cyclone 이면 인터페이스 고정 + 유니캐스트 탐색으로 안정화된다.
#
#   ★ 젯슨과 노트북의 dds 설정이 다르면 통신이 아예 안 된다. 양쪽 같게 둘 것.
#     (양쪽에 sudo apt install ros-humble-rmw-cyclonedds-cpp 필요)
# ------------------------------------------------------------
network:
  dds: cyclone              # cyclone | fastdds
                            # ※ "Failed to find a free participant index for domain 0" 로
                            #   스택 전체가 죽으면, 고아 프로세스가 RTPS 포트를 쥐고 있는
                            #   것이다 (2026-07-19에 6세대 17개 누적으로 실제 발생).
                            #   ./race.sh stop 으로 먼저 정리하고 다시 실행할 것.
                            #   그래도 안 되면 fastdds 로 되돌리면 즉시 복구된다.
  subnet: "192.168.50."     # 주행 내부망 대역 (2026-08-03 공유기 교체: 45→50)
                            #   각 기기가 이 대역에서 "자기" IP 를 찾아 인터페이스를
                            #   고정한다. 끝자리가 뭐든 상관없다.
                            #   (젯슨은 LiDAR 전용망 192.168.0.x 도 함께 올라와 있어서,
                            #    고정하지 않으면 그쪽을 잡아 노트북과 통신이 끊긴다)
  # ★★ 이 값은 **차량 파일이 덮는다** — config/vehicle_car{1,2}.yaml 의 network.peers.
  #   젯슨 IP 가 차마다 달라서(1호차 .57 / 2호차 .77), 여기 두면 두 차가 머지할
  #   때마다 이 한 줄이 충돌하고 남의 차 IP 가 들어가면 RViz 가 조용히 먹통이 된다.
  #   여기 적힌 값은 차량 파일에 network 절이 없을 때만 쓰이는 폴백이다.
  # ★ 여기엔 **젯슨 두 대를 모두** 적는다. 이유:
  #     · 각 젯슨은 자기 차량 파일(network.peers)이 이 목록을 자기 것 하나로 덮으므로
  #       두 개가 적혀 있어도 영향이 없다.
  #     · **노트북에는 .car 도 overlay 도 없어서 이 목록을 그대로 쓴다.** 한 대만
  #       적으면 노트북이 그쪽에만 인사하고, 다른 차와는 통신이 0 이 된다
  #       (2026-08-10: .57 만 적혀 있어 2호차 RViz 에 맵이 안 떴다).
  #   ※ 안 쓰는 IP 가 목록에 있어도 무해하다 — 응답 없는 주소로 인사만 한 번 갈 뿐이다.
  peers:
    - 192.168.50.57         #   1호차 젯슨
    - 192.168.50.77         #   2호차 젯슨


# ========================================================================
#  8. 계측 · 캘리브레이션 리그
# ========================================================================

# ------------------------------------------------------------
# 타이어 슬립 시험 (./race.sh slip)
#   ←→ 로 고른 반경의 조향각이 L스틱 최대값이 된다. 스틱을 끝까지 밀어 두고
#   속도만 천천히 올린다(0.3㎧² 이하). 상세: 개발현황.md
#
# ██████████████████████████████████████████████████████████████████
# ██ ⚠⚠ 반드시 완전히 트인 넓은 공간에서 할 것 — 실내 피트 금지 ⚠⚠ ██
# ██████████████████████████████████████████████████████████████████
#   마찰한계를 넘기면 차는 설정 반경을 **전혀 못 지킨다**. 실제로 잡히는 최소
#   반경은  r_real = v² / (mu·g)  로 속도의 제곱에 비례해 커진다:
#       v 3㎧ → 1.3m    5㎧ → 3.6m    6㎧ → 5.2m    7㎧ → 7.1m
#   즉 7㎧ 시험은 설정이 0.55m 여도 **지름 14m 이상**의 빈 공간이 필요하다.
#   2026-08-06 실차: 피트에서 7㎧ 로 돌리다 벽에 여러 번 강하게 충돌
#   (IMU 로그에 7.9g / 11.0g 충격 스파이크가 그대로 남았다).
#   → 넓은 공간을 확보하지 못했다면 speeds 를 3.0 이하로 줄여서 할 것.
# ------------------------------------------------------------
slip:
  # mode: rig       기존 원-그리기 슬립 리그 (slip_logger)
  # mode: friction  LiDAR+IMU 마찰계수 추정기 (slip_friction, 2509.15423)
  #                 → ./race.sh slip 하나로 모드 전환 가능
  mode: friction

  # ── friction 모드 전용 파라미터 ─────────────────────────────────
  # bias_sec:    3.0     # 정지 바이어스 측정 시간 (s)
  # cal_sec:     5.0     # 임계값 교정 주행 시간 (s, 이 동안 천천히 직진)
  # delta_ang:  -1.0     # 횡방향 슬립 임계값 (rad/s, 음수 = 자동 교정)
  #
  # enable_lin_slip: false   # ★ 종방향 슬립 판정 (기본 OFF — 켜지 말 것)
  # delta_lin:  -1.0         #   위가 true 일 때만 의미 있음
  #     D_lin 은 |v_wheel − v̂_x| 인데, 연속 스캔 정합으로는 v̂_x 를 못 구한다.
  #     트랙처럼 진행 방향과 나란한 벽이 지배적이면 종방향으로 얼마를 움직이든
  #     스캔이 똑같아 보인다 — dx 를 0→0.36m 훑어도 잔차가 20.2~21.2mm 로
  #     평평하다(2026-08-07 검증). 정보가 없어 어떤 튜닝으로도 안 된다.
  #     실측에서도 v_wheel 2.1㎧ 정속인데 vx_lidar 가 0.0~0.4 에 갇혔다.
  #     같은 기하가 횡방향은 반대로 강하게 구속해서(±0.1m 에 잔차 20.6→107mm)
  #     v̂_y·ω̂ 는 잘 나온다 — 슬립각 α 에 필요한 건 이쪽이다.
  #     2509.15423 이 v̂_x 를 쓴 건 스캔 정합이 아니라 지도 기반 EKF 라서다.
  #     정말 필요하면 AMCL pose 를 미분해 쓰는 쪽이 맞다.
  # min_speed:   0.3     # 추정 최소 속도 (m/s)
  #
  # ── friction 모드 조작 (Voser 정속 원형 주행) ─────────────────────
  #   조향은 **디지털**이다 — 스틱을 밀면 아래 반경에 해당하는 각도로 고정되고,
  #   놓으면 직진(0). 중간값이 없다. 사람 손으로 비례 스틱을 일정하게 유지할 수
  #   없고, 조향이 흔들리면 준정상상태 표본이 통째로 날아가기 때문이다.
  #
  #     D-pad ←→ : 반경 선택 (조향각 = atan(L/r) 로 환산)
  #     D-pad ↑↓ : 속도 상한 선택 (RT 끝까지 = 이 속도)
  #
  #   ★ 두 리스트의 값은 위 max_steer / max_speed 를 넘으면 **조용히 무시**된다
  #     (오버라이드는 낮추는 방향으로만 먹는다). 천장 안에 두어야 한다.
  #   ★ 반경 0.8m 는 조향 21.8° 로 좌 락(20.7°)을 넘어 우회전만 가능하다.
  #     패널이 경고를 띄운다.
  # radii:  [0.8, 1.0, 1.2, 1.5, 2.0]        # m
  # speeds: [1.0, 1.5, 2.0, 2.5, 3.0, 3.5]   # m/s (상한)
  #   ※ 위 두 줄은 **주석 예시**다. 실제로 쓰이는 radii/speeds 는 이 절 아래쪽에
  #     따로 있다 — 여기에 값을 적으면 YAML 중복 키가 되어 아래것이 이긴다.
  # dpad_x_invert: false
  # dpad_y_invert: false
  # record_bag: true     # 원시 /scan 등을 bag 으로 남긴다 (노트북 오프라인 튜닝용)
  #
  # max_scan_m: 10.0     # ★ ICP 에 쓸 최대 스캔 거리 (m)
  #     4.0 은 짧아서 못 쓴다 (2026-08-07 실측). Hokuyo 는 20m 를 보는데 4m 로
  #     자르면 복도 끝·모서리가 날아가고 진행 방향과 나란한 옆벽만 남는다.
  #     그러면 종방향 이동이 기하학적으로 관측 불가능하다(개구 문제) — 실제로
  #     2.1㎧ 정속 주행 중 vx_lidar 가 0.0~0.4 로 죽었고 회전만 멀쩡했다.
  # icp_points:  400     # ICP 질의점 수. 많을수록 분산↓ 비용↑
  #
  # lidar_x:    0.27     # ★ base_link → LiDAR 전방거리 [m]
  #     ICP 는 LiDAR 위치의 속도를 재는데 슬립각은 차체 기준이라, ω·x 만큼
  #     요레이트가 횡속도로 새어든다. ω 80°/s 면 0.38㎧ — 재려는 값보다 크다.
  #     보정 전 |β| 중앙 13.2° → 보정 후 5.5° (2026-08-07 실측 재생).
  #     기본값은 f1tenth_stack bringup 의 static TF (0.27 0 0.11) 에서 왔다.
  #     ※ 일반 주행 데이터로 회귀하면 0.39m 가 나오지만 초과분은 실제 후륜
  #       슬립이다. 그 값을 넣으면 정작 재려는 신호가 지워진다.
  #     ※ 제대로 재려면: 저속 큰 원(1.0~1.5㎧, 반경 2~3m, 좌우 2~3바퀴) 주행 후
  #         ros2 run race_stack slip_replay -- <bag> --calib-lever
  #
  # icp_hz:     10.0     # ★ ICP 실행 주파수 = 정합 **베이스라인** (10Hz→100ms)
  #     이 값이 v_y 정밀도를 직접 정한다. 2026-08-07 이전엔 실행 빈도만 낮추고
  #     베이스라인은 항상 스캔 간격(25ms)이라, v_y 0.2㎧ 의 횡변위 5mm 가
  #     LiDAR 노이즈에 묻혔다. 지금은 같은 조건에서 20mm 를 본다.
  #     ↓ 낮출수록 정밀하지만, 그 사이 차가 움직인 거리가 커져 정합이 깨진다
  #       (3㎧면 100ms 에 30cm). 5Hz 미만은 실측으로 확인 전엔 쓰지 말 것.
  # lpf_hz:      8.0     # IMU (a_x, a_y, ω_z) LPF 컷오프 (Hz)
  # lidar_lpf_hz: 2.0    # LiDAR 속도 LPF 컷오프 (Hz) — IMU 와 갱신율이 10배
  #     차이라 따로 둔다. 갱신율 10Hz 에서 컷오프를 5Hz(나이퀴스트) 이상으로
  #     주면 필터가 사실상 없는 것과 같다.

  # ★ 리그 전용 상한. 이 두 줄은 슬립 시험에만 쓰이고 자율주행 설정
  #   ([limits].grip_util, pure_pursuit.max_steer)과 무관하다.
  #   ※ 예전엔 joystick.max_speed(2.5)를 물려받았고, joystick_teleop 은 자기
  #     상한을 넘는 요청을 조용히 무시해서 speeds 의 3.0 칸이 영영 안 채워졌다.
  # ★ 2026-08-13: 7.0 → 2.5. 이건 speeds 리스트와 별개의 **마지막 방어선**이다.
  #   리그는 이 상한을 넘는 요청을 조용히 무시하므로, 실수로 높은 칸을 골라도
  #   여기서 막힌다. 7.0 은 지름 14m 이상 필요 — 2026-08-06 에 피트에서 7㎧ 로
  #   돌리다 벽에 11g 로 충돌한 기록이 있다. 넓은 곳에서 할 때 되돌릴 것.
  max_speed: 2.5            # 리그 최고속도 (m/s)
  max_steer: 0.55           # 리그 최대 조향각 (rad) = 31.5도
  #
  #   ★★★ 조향은 **좌우 비대칭**이다. config/vesc.yaml 기준 (2026-08-09):
  #        servo = -0.761 × steer + 0.3954,  servo_min/max = 0.12 / 0.85
  #          → 좌회전 락  +0.362 rad (20.73도)   ← 여기서 소프트 리밋에 걸린다
  #          → 우회전 락  -0.597 rad (34.16도)
  #        즉 **20.7도를 넘는 시험은 우회전으로만 가능하다.** 좌회전으로 돌리면
  #        서보가 0.12 에서 잘려 실제 각도는 20.73도인데 기록은 지령값이라
  #        데이터가 어긋난다. 21도 이상 칸은 반드시 우회전으로 돌 것.
  #        ※ vesc.yaml 의 offset/servo_min 을 바꾸면 이 숫자도 다시 계산할 것.

  # 시험 반경(m) → 조향각 atan(0.33/r) 로 환산해 스틱 최대값이 된다.
  #   ※ 아래는 1호차 기준이었다: 0.55→31.0도 0.65→26.9도 0.74→24.0도
  #      0.86→21.0도 1.00→18.3도 / 좌회전 락 20.73도
  #
  # ★★ 2026-08-13 (2호차): 위 다섯 값은 **전부 못 도는 반경**이다.
  #    조향 게인을 원 실측으로 다시 재니(-0.761 → -1.0827) 2호차 max_steer 가
  #    14.94° 이고 R_min 이 1.237m 다. 1.00m 조차 18.26° 를 요구해 불가능하다.
  #    설정만 바뀌고 차는 못 따라가면, 기록은 지령값이라 **데이터가 통째로
  #    오염된다** — 그래서 반드시 R_min 위로 잡아야 한다.
  #
  #    슬립 개시 속도 v = sqrt(μ_eff·g·r) (μ_eff 0.40 기준):
  #        1.3m → 2.26㎧ ✅   1.5m → 2.43㎧ ✅   (speeds 상한 2.5 안)
  #        1.8m → 2.66㎧ ❌   2.2m → 2.94㎧ ❌   (상한 밖 — 한계에 못 닿는다)
  #    1.8m 는 한계 미만 구간 표본용으로 남긴다.
  #
  #    ⚠ 좌우 비대칭: 2호차는 좌 14.94° / 우 22.10° 다. 아래 값은 전부
  #      14.24° 이하라 **좌우 모두 가능**하다.
  radii:       [1.3, 1.5, 1.8]

  # 측정 칸 분류용 속도 격자. max_speed 이하만 의미가 있다.
  #   ★ 실측 μ_eff 0.40 기준 슬립이 **시작**되는 속도는 sqrt(μ·g·R) 로
  #     전 구간 1.5~2.0㎧ 다:
  #       R 0.55→1.47   0.65→1.60   0.74→1.70   0.86→1.84   1.00→1.98 m/s
  #     그래서 3.0 부터는 이미 전 구간이 미끄러지는 영역이다. 슬립 곡선의
  #     피크 이후(포화 구간)를 재려는 것이므로 의도한 바가 맞다.
  #   ※ 다만 5~7 m/s 에서는 요구 횡가속도가 한계의 5~10배라 차가 원 반경을
  #     유지하지 못하고 바깥으로 크게 밀려난다. 실제 선회 반경이 설정값의
  #     몇 배가 되므로 **넓은 공간에서만** 돌릴 것 (반경 3~4m 여유 권장).
  #
  # ★★ 2026-08-13: 7m 공터에 맞춰 [3.0,4.0,5.0,6.0,7.0] → 아래로 낮췄다.
  #    넓은 곳(지름 15m 이상)에서 하면 원래 값으로 되돌릴 것.
  #    실제 선회 반경 r = v²/(μ_eff·g). μ 가 기대보다 나쁠 경우(0.30) 기준:
  #        2.0㎧ → 지름 2.7m ✅    2.5㎧ → 4.2m ✅
  #        3.0㎧ → 6.1m ❌         4.0㎧ → 10.9m ❌❌
  #    7m 공터에서 3.0 이상은 벽까지 여유가 0.5m 도 안 남는다.
  #    ※ 이 상한에서는 슬립 **개시~직후**만 재고 깊은 포화 구간은 못 잰다.
  #      radii 가 전부 1m 이하라 슬립 개시가 1.47~1.98㎧ 이므로, 2.0/2.5 칸이
  #      개시 직후 구간을 덮는다. Pacejka 피크 이후까지 필요하면 넓은 곳에서
  #      원래 값으로 다시 할 것.
  #    ※ race_script.yaml 은 두 차 공용이다 — 1호차가 넓은 곳에서 쓸 때는
  #      되돌려야 한다.
  speeds:      [1.5, 2.0, 2.5]
  target_runs: 3                          # 설정 하나당 목표 측정 횟수
  lever_x:     0.0                        # IMU~무게중심 앞뒤 거리(m). 재서 넣을 것
  mu:          0.4                        # 화면 표시용 (실측 추정 0.40±0.08)
  # D-pad 부호. 화면의 "D-pad x/y" 값을 보고 화살표와 반대면 켠다.
  dpad_x_invert: false
  dpad_y_invert: false

# ------------------------------------------------------------
# 곡률-속도 계단 캘리브레이션 리그 (./race.sh curvprobe)
#   slip: 섹션과 완전히 별개 도구 — 그쪽은 건드리지 않는다.
#   2026-08-07 개편: 조이스틱 수동 대신 프로그램이 /teleop(mux 최우선)에 직접
#   명령한다 — 조향은 항상 풀락 고정, 속도는 speed_start 부터 speed_step 씩
#   계단으로 올라간다. 사람은 SPACE로 "다음 단계" 신호만 준다(조작:
#   curvature_probe.py 상단 docstring 참고). 매 세션 한 방향만(steer_sign).
#   목적: gen_waypoints_kappa.py 의 KAPPA_MAX(무슬립 기하한계)는 있지만, 실제
#   로 그 곡률을 낼 만큼 빠르면 슬립으로 계획보다 넓게 밀려나는 문제
#   (2026-08-06 q1_max=2 실주행에서 확인)를 보완할 실측 v_max(κ) 를 구한다.
#   분석: ros2 run race_stack curvature_probe -- --analyze
# ------------------------------------------------------------
curv_probe:
  full_lock_steer: 0.65    # 리그 전용 조향 상한(rad) — 실제 기구 락(21.08°/32°)
                            # 보다 확실히 커서, 서보가 항상 기구적 한계에서
                            # 포화되게(=풀락) 한다.
  steer_sign: 1.0           # +1=좌회전, -1=우회전 — 세션 하나는 한 방향만
  speed_start: 0.5          # 첫 속도 단계 (m/s)
  speed_step:  0.25         # 단계 간격 (m/s)
  speed_max:   3.0          # 이 이상은 SPACE 눌러도 안 올라감
  accel_limit: 0.4          # 단계 전환 가감속 한계 (m/s^2)
  min_hold_sec: 3.0         # 목표속도 도달 후 이만큼 유지돼야 "다음단계 준비완료" 표시
  kappa_max: 1.1406        # gen_waypoints_kappa.py 의 KAPPA_MAX 와 맞출 것
                            # (wheelbase 0.33 · max_steer 0.36rad 기준)
  mu: 0.4                  # 화면 표시용 (실측 추정 0.40±0.08)

# ------------------------------------------------------------
# 6b. 조향 트림 자동 캘리브레이션 (steer_trim.py)
#   docs/steering_calibration.md 의 수동(눈으로 확인) 오프셋 튜닝 루프를
#   IMU 기반으로 자동화. 직진 test_dist 만큼 주행 → 자이로 적분으로 곡률
#   측정 → 반대방향 trim 보정 → 후진 test_dist 로 검증(+ 원위치 복귀) →
#   반복. 수렴하면 config/vesc.yaml 의 steering_angle_to_servo_offset 을
#   직접 계산해 반영(스택 재시작 필요 — 노드가 대신 해주지 않음).
#   slip/curv_probe 와 완전히 별개 도구.
# ------------------------------------------------------------
steer_trim:
  test_speed: 1.0           # 트림 탐색용 속도 (m/s) — 슬립 없는 저속 유지
  test_dist:  4.0           # 전진/후진 한 다리 거리 (m)
  accel_limit: 0.4          # 가감속 한계 (m/s^2)
  max_trim: 0.15            # trim 안전 클램프 (rad)
  kappa_tol: 0.01           # 수렴 판정 — 최근 전진/후진 |κ| 가 둘 다 이 이하
  correction_damp: 0.85     # 보정 스텝 감쇠 (1.0=이론값 그대로, 낮추면 안정적)
  max_iters: 8              # 이 안에 수렴 못하면 마지막 trim으로 종료
  front_safety_m: 0.4       # 전진 중 전방 라이다 최소거리 — 미만이면 비상정지
  rear_safety_m: 0.4        # 후진 중 후방(라이다 FOV 안일 때만 유효)
  auto_write: true          # 수렴 시 vesc.yaml 자동 반영 여부


# ========================================================================
#  9. 수동 조종
# ========================================================================

# ------------------------------------------------------------
# 조이스틱 수동 조종 (./race.sh joy 로 실행)
#
#   ★ 안전장치: btn_deadman 버튼을 누르는 동안만 차가 움직임
#
#   기본 축 매핑 (Logitech F710 등 일반 게임패드):
#     axis_steer  = 0  (왼쪽 스틱 좌우)
#     axis_speed  = 1  (왼쪽 스틱 앞뒤)
#     btn_deadman = 5  (RB 버튼)
#
#   조이스틱 번호 확인:  ros2 run joy joy_node  후  ros2 topic echo /joy
# ------------------------------------------------------------
joystick:
  # LB: joy 모드에서는 비활성, 주행 스택에서는 수동↔자율 전환
  #     (AMCL·LiDAR 는 계속 동작 — 다시 누르면 그 자리에서 이어감)
  manual_override: true          # false = 주행 중 조이스틱 개입 비활성
  # ★ ROS2 joy_node 는 /dev/input/jsN 경로가 아니라 SDL "몇 번째 패드" 번호(device_id)다.
  #   race.sh 가 아래 경로의 끝 숫자만 떼어 -p device_id:=N 으로 넘긴다.
  #   리눅스에 js1 로 보여도 패드가 1개면 번호는 거의 항상 0 이다. 1 로 두면
  #   두 번째 패드를 찾다 실패해서 mapping-joy 가 먹통이 된다 (2026-08-09).
  device:       /dev/input/js0   # → device_id=0 (첫 번째 패드). 두 개 꽂았을 때만 js1
  axis_steer:        0           # 조향 축 (L스틱 좌우, Mode OFF 아날로그)
  axis_speed:        5           # 속도 축 (RT 트리거, F710 X 모드)
  btn_reverse:       5           # 후진 전환 버튼 (RB — 누른 채 RT → 후진)
  btn_toggle:        4           # 수동↔자율 토글 버튼 (LB)
  steer_invert:      false       # 조향 좌우 반전
  speed_invert:      false       # 전진/후진 반전 (RT 방향)

  # ★ 트리거 부호 규약 — 읽는 경로에 따라 반대다!
  #     ROS /joy 토픽        : 안 누름 = +1, 끝까지 = -1   ← 이 노드의 기준
  #     커널 /dev/input/js0  : 안 누름 = -1, 끝까지 = +1   (check_joystick.py)
  # 실제 휴지는 joystick_teleop 이 기동 ~1초 자동 측정 (yaml 값은 초기 추정)
  trigger_invert:    true

  # 속도 응답 (RT를 당긴 만큼 선형 비례)
  trigger_deadzone:  0.05        # 트리거 유격 (0~1 기준). 살짝 스치는 입력 무시
  trigger_expo:      1.0         # 1.0 = 완전 선형 / 1.5~2.0 = 저속 구간 완만 (미세조작 쉬움)
  steer_deadzone:    0.08        # L스틱 중립 유격
  arm_on_neutral:    true        # 시작 시 RT 중립 확인 전까지 스로틀 잠금 (안전)
  debug:             true        # true → RT raw→스로틀%→m/s 를 콘솔에 출력
  # ★ ./race.sh joy 전용 최고속도 (m/s). 수동으로 시원하게 몰 때 쓴다.
  #   이 줄을 지우면 speed.mapping_max 로 폴백한다.
  #   ※ mapping / mapping-joy 는 영향 없음 — 맵핑은 천천히 돌아야 품질이 좋아서
  #     race.sh 가 speed.mapping_max 를 따로 읽는다.
  #   ※ 트랙이 4.4×3.7m 라 3.0 이면 한 변을 1.5초에 지난다. 처음엔 낮게 시작할 것.
  #   ※ RT 트리거는 당긴 만큼 비례하므로, 살살 당기면 그만큼 느리다.
  max_speed: 7
